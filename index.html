r:"Diabetic diet teaching includes consistent meal times, complex carbs, limiting refined sugars, and glucose monitoring. Skipping meals can cause hypoglycemia and is not recommended."},
{topic:"Fundamentals", q:"Which findings indicate a client is at risk for falls? Select all that apply.",
opts:["History of previous falls","Use of sedatives or diuretics","Impaired mobility or balance","Age over 65","Normal vision and gait"],correct:[0,1,2,3],
r:"Fall risk factors include previous falls, medications (sedatives, diuretics), impaired mobility/balance, and age over 65. Normal vision and gait are protective, not risk factors."},
{topic:"Fundamentals", q:"A nurse is implementing fall precautions. Which interventions are appropriate? Select all that apply.",
opts:["Keep the bed in the lowest position","Ensure call light is within reach","Keep the side rails up as needed","Use a bed alarm for high-risk clients","Leave the client unattended in the bathroom"],correct:[0,1,2,3],
r:"Fall precautions include low bed position, call light accessibility, side rails as needed, and bed alarms. Clients should never be left unattended in the bathroom."},
{topic:"Fundamentals", q:"A nurse is assessing a client for pressure injury risk. Which factors increase risk? Select all that apply.",
opts:["Immobility","Incontinence","Poor nutrition","Moisture","Normal BMI"],correct:[0,1,2,3],
r:"Pressure injury risk factors include immobility, incontinence, poor nutrition, and moisture. A normal BMI is not a risk factor."},
{topic:"Fundamentals", q:"Which staging correctly describes a Stage 3 pressure injury?",
opts:["Non-blanchable erythema of intact skin","Partial-thickness loss of skin with exposed dermis","Full-thickness loss of skin with visible subcutaneous fat","Full-thickness loss with exposed muscle, tendon, or bone"],correct:2,
r:"Stage 3 is full-thickness loss with visible subcutaneous fat (but no exposed muscle, tendon, or bone, which would be Stage 4). Stage 1 is non-blanchable erythema, Stage 2 is partial-thickness loss."},
{topic:"Fundamentals", q:"A nurse is caring for a client with an indwelling urinary catheter. Which interventions help prevent CAUTI? Select all that apply.",
opts:["Perform hand hygiene before and after care","Keep the drainage bag below the level of the bladder","Secure the catheter to the leg","Irrigate the catheter routinely","Empty the drainage bag regularly"],correct:[0,1,2,4],
r:"CAUTI prevention includes hand hygiene, keeping the bag below bladder level, securing the catheter, and regular emptying. Routine irrigation is not recommended and increases infection risk."},
{topic:"Fundamentals", q:"Which findings indicate a urinary tract infection? Select all that apply.",
opts:["Dysuria","Cloudy urine","Fever","Increased appetite","Urinary frequency"],correct:[0,1,2,4],
r:"UTI presents with dysuria, cloudy/foul-smelling urine, fever, and frequency/urgency. Appetite is typically unaffected or decreased, not increased."},
{topic:"Fundamentals", q:"A nurse is teaching a client about proper crutch walking. Which instructions are correct? Select all that apply.",
opts:["Keep crutches 2–3 fingerbreadths below the axilla","Support weight on the hands, not the axillae","Move the affected leg with the crutches","Look down at the feet while walking","Wear non-skid shoes"],correct:[0,1,2,4],
r:"Crutch walking: keep crutches below the axilla, support weight on hands, move affected leg with crutches, and wear non-skid shoes. Looking down at feet impairs balance; look forward."},
{topic:"Fundamentals", q:"Which are appropriate nursing interventions for a client with an IV infusion? Select all that apply.",
opts:["Assess the site for redness, swelling, or pain","Monitor the flow rate","Change the IV site per facility policy","Flush the IV line with heparin routinely for all clients","Document the site and solution"],correct:[0,1,2,4],
r:"IV care includes site assessment, flow rate monitoring, site rotation per policy, and documentation. Routine heparin flushing is not universal and depends on the type of access device."},
{topic:"Fundamentals", q:"A nurse suspects an IV infiltration. Which findings support this? Select all that apply.",
opts:["Swelling at the site","Coolness of the skin around the site","Pain at the site","Blood return in the tubing","Blanching at the site"],correct:[0,1,2,4],
r:"Infiltration presents with swelling, coolness, pain, and blanching at the site. Blood return is typically absent or sluggish, not present."},
{topic:"Fundamentals", q:"A nurse is teaching a client about the use of an incentive spirometer. Which instructions are correct? Select all that apply.",
opts:["Sit upright","Exhale normally, then inhale slowly and deeply through the mouthpiece","Hold the breath for 3–5 seconds","Use 5–10 times per hour while awake","Exhale forcefully through the mouthpiece"],correct:[0,1,2,3],
r:"Incentive spirometer use: sit upright, exhale normally, inhale slowly and deeply, hold 3–5 seconds, and use 5–10 times per hour. Exhalation is normal, not forceful, through the mouthpiece."},
{topic:"Fundamentals", q:"Which findings indicate hypoxia in a client? Select all that apply.",
opts:["Restlessness","Confusion","Cyanosis","Bradycardia","Increased respiratory rate"],correct:[0,1,2,4],
r:"Hypoxia may cause restlessness, confusion, cyanosis, and an increased respiratory rate. Tachycardia is a common early compensatory response, while bradycardia can occur as a late sign of severe hypoxemia."},
{topic:"Fundamentals", q:"A nurse is caring for a client with an order for oxygen therapy. Which safety measures are appropriate? Select all that apply.",
opts:["Post 'No Smoking' signs","Keep oxygen equipment away from heat sources","Use petroleum-based products on the face","Ensure electrical equipment is grounded","Store oxygen cylinders upright and secured"],correct:[0,1,3,4],
r:"Oxygen safety includes no-smoking signs, keeping equipment away from heat, grounding electrical equipment, and securing cylinders upright. Petroleum-based products are flammable and should be avoided."},
{topic:"Fundamentals", q:"A nurse is teaching a client about pursed-lip breathing. Which instructions are correct? Select all that apply.",
opts:["Inhale through the nose for 2 seconds","Exhale through pursed lips for 4 seconds","Use during activities that cause shortness of breath","Breathe rapidly through the mouth","Relax the shoulders and neck"],correct:[0,1,2,4],
r:"Pursed-lip breathing: inhale through the nose for 2 seconds, exhale through pursed lips for 4 seconds, use during dyspnea, and relax shoulders/neck. Rapid mouth breathing is not part of this technique."},
{topic:"Fundamentals", q:"A nurse is documenting a client's intake and output. Which items are included in intake? Select all that apply.",
opts:["Oral fluids","IV fluids","Ice chips (recorded as half volume)","Tube feedings","Urine output"],correct:[0,1,2,3],
r:"Intake includes oral fluids, IV fluids, ice chips (about half the volume), and tube feedings. Urine output is part of output, not intake."},
{topic:"Fundamentals", q:"Which factors affect a client's blood pressure reading? Select all that apply.",
opts:["Position of the arm","Cuff size","Recent caffeine or smoking","Time of day","Blood glucose level"],correct:[0,1,2,3],
r:"BP is affected by arm position, cuff size, recent caffeine/smoking, and time of day. Blood glucose does not directly affect BP measurement."},
{topic:"Fundamentals", q:"A nurse is teaching a client about home blood pressure monitoring. Which instructions are correct? Select all that apply.",
opts:["Sit quietly for 5 minutes before measuring","Use the correct cuff size","Place the cuff on the bare arm","Measure after exercise to get an accurate reading","Record readings for the physician"],correct:[0,1,2,4],
r:"Home BP monitoring: rest 5 minutes, use correct cuff size, place on bare arm, and record readings. Measuring after exercise can falsely elevate BP and should be avoided."},
{topic:"Fundamentals", q:"Which findings may indicate a client has a hearing impairment? Select all that apply.",
opts:["Frequently asking others to repeat themselves","Turning up the TV volume","Speaking in a monotone voice","Responding inappropriately to questions","Complaining of tinnitus"],correct:[0,1,3,4],
r:"Frequently asking for repetition, increasing the TV volume, inappropriate responses, and tinnitus may indicate hearing impairment. A monotone voice is nonspecific and should not be treated as a defining sign of hearing loss."},
{topic:"Fundamentals", q:"A nurse is communicating with a client who is hearing impaired. Which strategies are appropriate? Select all that apply.",
opts:["Face the client when speaking","Speak clearly and slowly","Use written communication if needed","Shout loudly to ensure the client hears","Reduce background noise"],correct:[0,1,2,4],
r:"Communication strategies include facing the client, speaking clearly and slowly, using written communication, and reducing background noise. Shouting can distort sound and is not helpful."},
{topic:"Fundamentals", q:"A nurse is teaching a client about the use of a walker. Which instructions are correct? Select all that apply.",
opts:["Move the walker forward a short distance, then step into it","Keep the walker close enough to maintain a stable base of support","Look down continuously at the feet while walking","Wear non-skid shoes","Use the walker on stairs without assistance initially"],correct:[0,1,3],
r:"Walker use includes advancing the walker a short distance, stepping into it, maintaining a stable base of support, and wearing non-skid shoes. Continuous downward gaze can impair balance, and stairs require appropriate assistance/training."},

// ---------- Normal Psychiatric Nursing ----------
{topic:"Psychiatric", q:"Which nursing response demonstrates therapeutic communication with a client expressing sadness?",
opts:["'You shouldn't feel that way, things will get better.'","'I understand exactly how you feel.'","'Tell me more about what's making you feel this way.'","'Let's talk about something more positive instead.'"],correct:2,
r:"Open-ended questions that invite the client to elaborate ('tell me more') demonstrate therapeutic communication by encouraging expression, whereas the others give false reassurance, false empathy, or change the subject."},
{topic:"Psychiatric", q:"A client with generalized anxiety disorder is describing excessive worry. Which nursing intervention is most appropriate during a moderate anxiety level?",
opts:["Leave the client alone to calm down independently","Use short, simple, clear statements and remain with the client","Engage the client in complex problem-solving discussions","Immediately administer PRN sedatives without further assessment"],correct:1,
r:"At moderate anxiety, perceptual field narrows somewhat; the nurse should use clear, simple language and stay present to help the client refocus, rather than leaving them alone or overwhelming them with complexity."},
{topic:"Psychiatric", q:"Which is a priority nursing assessment for a client newly started on lithium therapy?",
opts:["Fasting blood glucose","Serum lithium level and signs of toxicity (e.g., tremor, GI upset)","Peak flow measurement","Serum calcium level"],correct:1,
r:"Lithium has a narrow therapeutic index (0.6–1.2 mEq/L); regular monitoring of serum levels and early signs of toxicity (tremor, nausea, ataxia) is essential to prevent serious harm."},
{topic:"Psychiatric", q:"A client with major depressive disorder suddenly appears calmer, gives away personal belongings, and states 'everything will be fine now.' This should alert the nurse to:",
opts:["Improved mood indicating recovery","Possible increased suicide risk","Onset of mania","Medication non-adherence"],correct:1,
r:"A sudden lift in mood after a period of severe depression, combined with giving away possessions, can indicate the client has resolved on a plan for suicide — this requires immediate safety assessment, not reassurance that they're 'better'."},
{topic:"Psychiatric", q:"Which is the primary goal of milieu therapy in an inpatient psychiatric setting?",
opts:["To isolate clients to reduce stimulation","To use the therapeutic environment itself to promote healthy behaviors and interaction","To enforce strict punishment for maladaptive behavior","To replace individual therapy sessions entirely"],correct:1,
r:"Milieu therapy uses the structured, safe environment — including scheduled activities, peer interaction, and consistent rules — as a therapeutic tool to support behavior change and social skill-building."},
{topic:"Psychiatric", q:"A client diagnosed with schizophrenia states, 'The television is sending me secret messages.' The nurse recognizes this as:",
opts:["An illusion","A delusion of reference","Echolalia","A hallucination"],correct:1,
r:"Believing that neutral external events (like TV broadcasts) carry personal, secret meaning is a delusion of reference — a fixed false belief, distinct from hallucinations (false sensory perception) or illusions (misinterpreted real stimuli)."},

{topic:"Psychiatric", q:"A client with alcohol use disorder insists, 'I don't have a drinking problem, I can stop anytime.' This is an example of which defense mechanism?",
opts:["Projection","Denial","Displacement","Sublimation"],correct:1,
r:"Denial is the refusal to acknowledge a painful reality (such as substance dependence) despite clear evidence, often serving to protect the person from anxiety."},
{topic:"Psychiatric", q:"Which sequence correctly reflects the phases of the nurse-client therapeutic relationship?",
opts:["Working → orientation → termination","Orientation → working → termination","Termination → orientation → working","Orientation → termination → working"],correct:1,
r:"The therapeutic relationship progresses through orientation (establishing trust and setting goals), working (addressing problems and promoting change), and termination (ending the relationship and evaluating progress)."},
{topic:"Psychiatric", q:"A client on haloperidol develops sudden, sustained muscle spasms of the neck and face. This extrapyramidal symptom is known as:",
opts:["Tardive dyskinesia","Akathisia","Acute dystonia","Pseudoparkinsonism"],correct:2,
r:"Acute dystonia presents as sudden, painful, sustained muscle contractions (often neck/face) and is a common early extrapyramidal side effect of typical antipsychotics like haloperidol, treated with anticholinergics."},
{topic:"Psychiatric", q:"A client who chronically abuses alcohol abruptly stops drinking. Delirium tremens (DTs), if they occur, typically peak within:",
opts:["2–4 hours after last drink","6–12 hours after last drink","48–96 hours after last drink","2 weeks after last drink"],correct:2,
r:"Delirium tremens is a severe alcohol withdrawal complication that typically emerges 48–96 hours after the last drink and can include severe agitation, hallucinations, and autonomic instability requiring close monitoring."},
{topic:"Psychiatric", q:"A client with a pattern of unstable relationships, impulsivity, and intense fear of abandonment most likely has which personality disorder?",
opts:["Antisocial personality disorder","Borderline personality disorder","Schizoid personality disorder","Obsessive-compulsive personality disorder"],correct:1,
r:"Borderline personality disorder (Cluster B) is characterized by unstable relationships, impulsivity, identity disturbance, and intense fear of abandonment, often accompanied by self-harm behaviors."},
{topic:"Psychiatric", q:"According to Kübler-Ross, which stage of grief typically comes immediately after denial?",
opts:["Bargaining","Anger","Depression","Acceptance"],correct:1,
r:"Kübler-Ross's stages generally progress: denial → anger → bargaining → depression → acceptance, though clients may not move through them in strict order or may revisit stages."},
{topic:"Psychiatric", q:"Under what circumstance is the use of seclusion or restraint in psychiatric care justified?",
opts:["To punish disruptive behavior","When the client poses an imminent danger to self or others and less restrictive measures have failed","Whenever a client refuses medication","At the nurse's convenience during short-staffed shifts"],correct:1,
r:"Seclusion/restraint is an emergency safety measure used only when a client presents imminent danger to self or others and less restrictive interventions have been attempted or are not feasible, per legal and ethical standards."},
{topic:"Psychiatric", q:"The nurse says to a client, 'You mentioned you felt abandoned when your father left — tell me more about that.' This is an example of which therapeutic communication technique?",
opts:["Giving advice","Reflecting","Minimizing feelings","Changing the subject"],correct:1,
r:"Reflecting involves repeating or paraphrasing part of what the client said to encourage them to explore feelings further, showing the nurse is listening and inviting deeper expression."},
{topic:"Psychiatric", q:"When assessing suicide risk, which nursing approach is most appropriate?",
opts:["Avoid mentioning suicide directly to prevent 'planting the idea'","Ask directly, 'Are you thinking of harming or killing yourself?'","Only assess risk if the client brings it up first","Assume risk is low if the client appears calm"],correct:1,
r:"Direct, non-judgmental questioning about suicidal ideation does not increase risk and is essential for accurate assessment; avoiding the topic can miss a client in danger, and calm affect does not rule out risk."},
{topic:"Psychiatric", q:"In group therapy, a member who frequently summarizes what others have said and helps keep the group focused is fulfilling which role?",
opts:["Blocker role","Task role (e.g., coordinator/clarifier)","Aggressor role","Self-confessor role"],correct:1,
r:"Task roles in group dynamics (such as coordinating, clarifying, or summarizing) help the group achieve its goals, in contrast to disruptive roles like blocking or aggression, or self-focused roles like the self-confessor."},
{topic:"Psychiatric", q:"A nurse is assessing a client with schizophrenia. Which findings are considered positive symptoms? Select all that apply.",
opts:["Hallucinations","Delusions","Disorganized speech","Flat affect","Avolition"],correct:[0,1,2],
r:"Positive symptoms are added experiences: hallucinations, delusions, disorganized speech/behavior. Negative symptoms (flat affect, avolition, anhedonia, alogia) reflect a loss of normal function."},
{topic:"Psychiatric", q:"Which findings are negative symptoms of schizophrenia? Select all that apply.",
opts:["Flat affect","Avolition","Anhedonia","Hallucinations","Alogia"],correct:[0,1,2,4],
r:"Negative symptoms include flat affect, avolition (lack of motivation), anhedonia (inability to feel pleasure), alogia (poverty of speech), and social withdrawal. Hallucinations are positive symptoms."},
{topic:"Psychiatric", q:"A client is experiencing auditory hallucinations. Which nursing interventions are appropriate? Select all that apply.",
opts:["Ask the client what the voices are saying","Provide reality orientation","Engage the client in simple, concrete activities","Agree with the hallucination to build trust","Redirect the client to reality-based topics"],correct:[0,1,2,4],
r:"For hallucinations: assess content (especially command hallucinations), provide reality orientation, engage in activities, and redirect. Never agree with or validate the hallucination."},
{topic:"Psychiatric", q:"A client states, 'I am the president of the Philippines.' The nurse recognizes this as:",
opts:["A hallucination","A delusion of grandeur","A delusion of persecution","An illusion"],correct:1,
r:"A delusion of grandeur is a false belief that one has exceptional power, identity, or importance. Delusions of persecution involve beliefs of being targeted or harmed."},
{topic:"Psychiatric", q:"A client believes the government is poisoning the water supply. The nurse recognizes this as:",
opts:["Delusion of grandeur","Delusion of persecution","Somatic delusion","Nihilistic delusion"],correct:1,
r:"A delusion of persecution is a false belief that one is being harassed, threatened, or harmed by others. Somatic delusions involve body-related false beliefs; nihilistic delusions involve beliefs of nonexistence."},
{topic:"Psychiatric", q:"A nurse is caring for a client with paranoid delusions. Which communication strategies are appropriate? Select all that apply.",
opts:["Use a calm, non-threatening approach","Avoid touching the client without warning","Argue with the client about the delusion","Provide simple, honest explanations","Maintain consistent staff assignments"],correct:[0,1,3,4],
r:"For paranoid clients: approach calmly, avoid unexpected touch, do not argue about delusions, give simple honest explanations, and maintain consistency. Arguing increases distrust and agitation."},
{topic:"Psychiatric", q:"A client with schizophrenia is started on clozapine. Which findings require immediate intervention? Select all that apply.",
opts:["Fever with sore throat","Severe dizziness on standing","WBC count of 2,500/mm³","Mild constipation","Sudden weight gain"],correct:[0,1,2],
r:"Clozapine can cause agranulocytosis (fever, sore throat, low WBC) and severe orthostatic hypotension. These require immediate intervention. Mild constipation and weight gain are common side effects requiring monitoring but not emergencies."},
{topic:"Psychiatric", q:"Which laboratory monitoring is required for a client on clozapine?",
opts:["Liver function tests only","Absolute neutrophil count (ANC) monitoring","Serum lithium levels","Thyroid function tests"],correct:1,
r:"Clozapine requires regular ANC monitoring due to the risk of agranulocytosis. In the Philippines, REMS-like protocols require weekly ANC for the first 6 months, then biweekly, then monthly."},
{topic:"Psychiatric", q:"A client on risperidone reports breast tenderness and galactorrhea. The nurse recognizes this as:",
opts:["A normal side effect that requires no intervention","Hyperprolactinemia due to dopamine blockade","A sign of tardive dyskinesia","An allergic reaction"],correct:1,
r:"Risperidone and other antipsychotics block dopamine, which can increase prolactin levels (hyperprolactinemia), causing breast tenderness, galactorrhea, amenorrhea, and sexual dysfunction. It should be reported to the physician."},
{topic:"Psychiatric", q:"Which findings indicate tardive dyskinesia? Select all that apply.",
opts:["Involuntary tongue movements","Lip smacking","Facial grimacing","Rapid, involuntary limb movements","Sudden muscle spasms of the neck"],correct:[0,1,2,3],
r:"Tardive dyskinesia involves involuntary, repetitive movements (tongue, lips, face, limbs) that develop after long-term antipsychotic use. Acute dystonia presents with sudden neck/face muscle spasms."},
{topic:"Psychiatric", q:"A client on lithium reports increased urination and thirst. The nurse recognizes this as:",
opts:["Lithium toxicity","Expected side effect of lithium (nephrogenic diabetes insipidus)","Sign of dehydration","Allergic reaction"],correct:1,
r:"Lithium can cause nephrogenic diabetes insipidus, leading to polyuria and polydipsia. Clients should maintain adequate fluid intake (2–3 L/day) and report significant changes."},
{topic:"Psychiatric", q:"Which factors increase the risk of lithium toxicity? Select all that apply.",
opts:["Dehydration","Low-sodium diet","Use of NSAIDs","Regular exercise","Impaired renal function"],correct:[0,1,2,4],
r:"Lithium toxicity risk increases with dehydration, low sodium intake, NSAIDs, and renal impairment. Regular exercise is not a direct risk factor, though dehydration from exercise can contribute."},
{topic:"Psychiatric", q:"A nurse is teaching a client about lithium therapy. Which instructions are correct? Select all that apply.",
opts:["Maintain consistent sodium intake","Drink 2–3 liters of fluid daily","Have serum lithium levels checked regularly","Stop the medication if you feel better","Report tremor, vomiting, or diarrhea"],correct:[0,1,2,4],
r:"Lithium teaching: consistent sodium/fluid intake, regular level monitoring, and reporting toxicity signs. Medication should never be stopped abruptly without physician guidance."},
{topic:"Psychiatric", q:"A client with major depressive disorder is started on sertraline. Which instructions should the nurse include? Select all that apply.",
opts:["Take the medication in the morning","Report increased suicidal thoughts","Expect improvement within 1–2 weeks","Avoid alcohol","Do not stop the medication abruptly"],correct:[1,3,4],
r:"Sertraline may be taken in the morning or evening (depending on side effects). Improvement takes 2–4 weeks. Clients should report increased suicidal thoughts, avoid alcohol, and not stop abruptly."},
{topic:"Psychiatric", q:"A client on an SSRI develops agitation, hyperthermia, and muscle rigidity. The nurse suspects:",
opts:["Neuroleptic malignant syndrome","Serotonin syndrome","Acute dystonia","Lithium toxicity"],correct:1,
r:"Serotonin syndrome presents with mental status changes, autonomic instability (hyperthermia, tachycardia), and neuromuscular abnormalities (rigidity, clonus). It is a medical emergency."},
{topic:"Psychiatric", q:"Which findings indicate neuroleptic malignant syndrome (NMS)? Select all that apply.",
opts:["High fever","Muscle rigidity","Autonomic instability","Elevated creatine kinase (CK)","Hypotension with bradycardia"],correct:[0,1,2,3],
r:"NMS presents with high fever, lead-pipe rigidity, autonomic instability (tachycardia, labile BP), and elevated CK. It is a life-threatening emergency requiring immediate discontinuation of antipsychotics."},
{topic:"Psychiatric", q:"A client with bipolar disorder is in a manic phase. Which nursing interventions are appropriate? Select all that apply.",
opts:["Provide a structured, low-stimulation environment","Set firm, consistent limits on behavior","Encourage group therapy immediately","Monitor for exhaustion and dehydration","Administer mood stabilizers as ordered"],correct:[0,1,3,4],
r:"For mania: provide structure and low stimulation, set firm limits, monitor for exhaustion/dehydration, and administer medications. Group therapy is overstimulating during acute mania and should be deferred."},
{topic:"Psychiatric", q:"A client with bipolar disorder is started on valproic acid. Which laboratory tests require monitoring? Select all that apply.",
opts:["Liver function tests","Serum valproic acid levels","Complete blood count","Serum amylase","Serum calcium"],correct:[0,1,2],
r:"Valproic acid requires monitoring of LFTs (hepatotoxicity), serum levels (therapeutic 50–100 mcg/mL), and CBC (thrombocytopenia). Amylase and calcium are not routinely monitored."},
{topic:"Psychiatric", q:"Which are risk factors for suicide? Select all that apply.",
opts:["Previous suicide attempt","Family history of suicide","Substance abuse","Chronic illness","Strong social support"],correct:[0,1,2,3],
r:"Suicide risk factors include previous attempts, family history, substance abuse, chronic illness, access to means, and social isolation. Strong social support is protective, not a risk factor."},
{topic:"Psychiatric", q:"A client is admitted after a suicide attempt. Which nursing interventions are priorities? Select all that apply.",
opts:["Remove harmful objects from the environment","Perform one-on-one observation if ordered","Assess for suicidal ideation regularly","Allow unsupervised bathroom visits","Develop a safety plan with the client"],correct:[0,1,2,4],
r:"Post-suicide attempt care: remove harmful objects, provide close observation, assess ideation, and develop a safety plan. Unsupervised bathroom visits are not allowed for high-risk clients."},
{topic:"Psychiatric", q:"A client with anorexia nervosa is admitted. Which findings are expected? Select all that apply.",
opts:["Low body weight","Fear of gaining weight or persistent behavior that interferes with weight gain","Disturbed perception of body weight or shape","Amenorrhea","Binge eating episodes"],correct:[0,1,2],
r:"Anorexia nervosa involves significantly low body weight, an intense fear of gaining weight or persistent behavior that interferes with weight gain, and disturbance in the way body weight or shape is experienced. Amenorrhea may occur but is no longer a required diagnostic criterion. Recurrent binge eating is more characteristic of bulimia nervosa."},
{topic:"Psychiatric", q:"A client with bulimia nervosa is admitted. Which findings are expected? Select all that apply.",
opts:["Normal or near-normal weight","Binge eating episodes","Self-induced vomiting","Dental enamel erosion","Significant weight loss"],correct:[0,1,2,3],
r:"Bulimia nervosa often presents with normal weight, binge-purge episodes, and complications like dental erosion and electrolyte imbalances. Significant weight loss is more characteristic of anorexia nervosa."},
{topic:"Psychiatric", q:"A client with anorexia nervosa is being refed. Which finding requires immediate intervention?",
opts:["Weight gain of 0.5 kg per week","Refeeding syndrome with electrolyte imbalances","Increased appetite","Improved mood"],correct:1,
r:"Refeeding syndrome can occur when nutrition is reintroduced too quickly, causing dangerous shifts in electrolytes (especially phosphate, potassium, magnesium) and cardiac complications. It requires immediate intervention."},
{topic:"Psychiatric", q:"A nurse is caring for a client with alcohol withdrawal. Which findings indicate severe withdrawal (delirium tremens)? Select all that apply.",
opts:["Hallucinations","Severe agitation","Autonomic instability","Tremors","Bradycardia"],correct:[0,1,2,3],
r:"Delirium tremens presents with hallucinations, severe agitation, autonomic instability (tachycardia, hypertension, fever), and tremors. Tachycardia, not bradycardia, is expected."},
{topic:"Psychiatric", q:"A client with alcohol use disorder is started on naltrexone. Which instructions should the nurse include? Select all that apply.",
opts:["It reduces cravings for alcohol","It blocks the pleasurable effects of alcohol","It can cause nausea","It is safe in pregnancy","It may cause liver toxicity"],correct:[0,1,2,4],
r:"Naltrexone can reduce alcohol craving and the rewarding effects of alcohol. Nausea and hepatotoxicity are important adverse effects to monitor. Pregnancy should be discussed with the prescriber so risks and benefits can be assessed; the old FDA pregnancy-letter category system is no longer used."},
{topic:"Psychiatric", q:"A client with opioid use disorder is started on methadone. Which statements are correct? Select all that apply.",
opts:["It is a long-acting opioid agonist","It reduces withdrawal symptoms","It can be dispensed daily at a clinic","It has no risk of dependence","It can cause respiratory depression in overdose"],correct:[0,1,2,4],
r:"Methadone is a long-acting opioid agonist used for maintenance, reduces withdrawal/cravings, is dispensed daily, and can cause respiratory depression in overdose. It DOES carry a risk of dependence."},
{topic:"Psychiatric", q:"Which findings indicate a client is experiencing withdrawal from benzodiazepines? Select all that apply.",
opts:["Anxiety","Tremors","Insomnia","Seizures","Bradycardia"],correct:[0,1,2,3],
r:"Benzodiazepine withdrawal presents with anxiety, tremors, insomnia, seizures, and autonomic hyperactivity (tachycardia, sweating). Bradycardia is not typical."},
{topic:"Psychiatric", q:"A nurse is caring for a client with post-traumatic stress disorder (PTSD). Which findings are expected? Select all that apply.",
opts:["Flashbacks","Hypervigilance","Avoidance of reminders","Emotional numbing","Increased trust in others"],correct:[0,1,2,3],
r:"PTSD presents with flashbacks, hypervigilance, avoidance, emotional numbing, and difficulty trusting others. Increased trust is not characteristic."},
{topic:"Psychiatric", q:"Which therapeutic communication techniques are appropriate for a client with PTSD? Select all that apply.",
opts:["Use open-ended questions","Validate the client's feelings","Encourage detailed re-telling of the trauma immediately","Maintain a calm, predictable environment","Teach grounding techniques"],correct:[0,1,3,4],
r:"For PTSD: use open-ended questions, validate feelings, maintain a calm environment, and teach grounding. Detailed re-telling should only occur when the client is ready and with professional guidance."},
{topic:"Psychiatric", q:"A child is diagnosed with autism spectrum disorder. Which findings are expected? Select all that apply.",
opts:["Impaired social interaction","Repetitive behaviors","Delayed language development","Strong eye contact","Insistence on sameness"],correct:[0,1,2,4],
r:"Autism spectrum disorder presents with impaired social interaction, repetitive behaviors, delayed language, and insistence on sameness. Poor eye contact, not strong eye contact, is typical."},
{topic:"Psychiatric", q:"A child with attention-deficit/hyperactivity disorder (ADHD) is started on methylphenidate. Which instructions should the nurse include? Select all that apply.",
opts:["Administer in the morning to prevent insomnia","Monitor appetite and growth","Report increased heart rate","Administer at bedtime for best effect","Monitor for mood changes"],correct:[0,1,2,4],
r:"Methylphenidate is given in the morning (can cause insomnia), requires monitoring of appetite/growth, heart rate, and mood. Bedtime dosing is avoided due to insomnia."},
{topic:"Psychiatric", q:"A nurse is caring for a client with borderline personality disorder who is manipulating staff. Which interventions are appropriate? Select all that apply.",
opts:["Maintain consistent limits","Use clear, direct communication","Rotate staff assignments frequently","Avoid arguing with the client","Document behavioral patterns"],correct:[0,1,3,4],
r:"For borderline personality disorder: maintain consistent limits, use clear communication, avoid arguing, and document patterns. Consistent staff assignments (not frequent rotation) are preferred to build trust."},
{topic:"Psychiatric", q:"A nurse is caring for a client with antisocial personality disorder. Which behaviors are expected? Select all that apply.",
opts:["Manipulation of others","Lack of remorse","Impulsivity","Excessive empathy","Disregard for rules"],correct:[0,1,2,4],
r:"Antisocial personality disorder is characterized by manipulation, lack of remorse, impulsivity, and disregard for rules. Empathy is typically lacking, not excessive."},
{topic:"Psychiatric", q:"Which interventions are appropriate for a client experiencing a panic attack? Select all that apply.",
opts:["Stay with the client","Speak in a calm, reassuring voice","Encourage the client to breathe slowly","Leave the client alone to regain control","Move the client to a quiet area"],correct:[0,1,2,4],
r:"During a panic attack: stay with the client, speak calmly, encourage slow breathing, and reduce stimulation. Leaving the client alone increases fear and should be avoided."},
{topic:"Psychiatric", q:"A client is prescribed alprazolam for anxiety. Which instructions should the nurse include? Select all that apply.",
opts:["Avoid alcohol while taking this medication","Do not stop the medication abruptly","Take it only as prescribed","Drive carefully until you know the effects","Take with grapefruit juice for better absorption"],correct:[0,1,2,3],
r:"Benzodiazepine teaching: avoid alcohol, do not stop abruptly (seizure risk), take only as prescribed, and use caution with driving. Grapefruit juice increases benzodiazepine levels and should be avoided."},

// ---------- Abnormal Pediatric Nursing ----------
{topic:"Abnormal Pediatrics", q:"A child with suspected epiglottitis is brought to the ED. Which nursing action is contraindicated?",
opts:["Keeping the child calm and upright","Preparing for possible emergency intubation","Inspecting the throat with a tongue depressor","Administering humidified oxygen as tolerated"],correct:2,
r:"Examining the throat or attempting to visualize the epiglottis directly can trigger complete airway obstruction in epiglottitis. The child should be kept calm, upright, and airway equipment should be ready."},
{topic:"Abnormal Pediatrics", q:"An infant with suspected pyloric stenosis is expected to present with which classic symptom?",
opts:["Bile-stained (greenish) vomiting","Projectile, non-bilious vomiting after feeding","Bloody, currant-jelly stools","Abdominal distention with absent bowel sounds"],correct:1,
r:"Pyloric stenosis classically causes forceful, projectile vomiting of non-bilious (undigested milk) contents shortly after feeding, due to hypertrophy of the pyloric muscle obstructing gastric outflow."},
{topic:"Abnormal Pediatrics", q:"A nurse is assessing a newborn with suspected tracheoesophageal fistula (TEF). Which findings are expected? Select all that apply.",
opts:["Excessive oral secretions","Choking and cyanosis during feeding","Abdominal distention","Polyhydramnios during pregnancy","Increased appetite"],correct:[0,1,2,3],
r:"TEF/EA presents with excessive secretions, choking/cyanosis with feeding, abdominal distention (from air entering the GI tract), and maternal polyhydramnios. Appetite is not increased; feeding problems are present."},
{topic:"Abnormal Pediatrics", q:"A newborn with suspected esophageal atresia is admitted. Which nursing interventions are appropriate? Select all that apply.",
opts:["Maintain NPO status","Suction secretions as needed","Position with the head elevated","Administer oral feedings to test swallowing","Prepare for surgical repair"],correct:[0,1,2,4],
r:"For esophageal atresia: keep NPO, suction secretions, elevate the head, and prepare for surgery. Oral feedings are contraindicated due to the risk of aspiration."},
{topic:"Abnormal Pediatrics", q:"An infant with a myelomeningocele is admitted. Which nursing interventions are appropriate? Select all that apply.",
opts:["Cover the sac with sterile, moist saline dressing","Position the infant prone","Monitor for signs of infection","Apply direct pressure to the sac","Monitor for hydrocephalus"],correct:[0,1,2,4],
r:"For myelomeningocele: cover with sterile moist dressing, position prone, monitor for infection and hydrocephalus. Direct pressure on the sac is contraindicated."},
{topic:"Abnormal Pediatrics", q:"Which findings indicate hydrocephalus in an infant? Select all that apply.",
opts:["Rapid head circumference growth","Bulging fontanel","Sunset eyes","Vomiting and irritability","Sunken fontanel"],correct:[0,1,2,3],
r:"Hydrocephalus presents with rapid head growth, bulging fontanel, sunset eyes, vomiting, and irritability. A sunken fontanel suggests dehydration, not hydrocephalus."},
{topic:"Abnormal Pediatrics", q:"An infant with a ventriculoperitoneal (VP) shunt is admitted. Which findings require immediate intervention? Select all that apply.",
opts:["Headache and vomiting","Redness along the shunt tract","Sunsetting eyes","Improved feeding","Lethargy"],correct:[0,1,2,4],
r:"VP shunt malfunction/infection presents with headache, vomiting, redness along the tract, sunset eyes, and lethargy. Improved feeding is not a sign of complication."},
{topic:"Abnormal Pediatrics", q:"A child with cerebral palsy is at risk for contractures. Which nursing interventions are appropriate? Select all that apply.",
opts:["Perform passive range-of-motion exercises","Position with proper alignment","Encourage mobility as tolerated","Restrict all movement to prevent injury","Use orthotic devices as prescribed"],correct:[0,1,2,4],
r:"For cerebral palsy: passive ROM, proper positioning, encouraging mobility, and orthotics help prevent contractures. Restricting movement worsens contractures and is contraindicated."},
{topic:"Abnormal Pediatrics", q:"A child with cerebral palsy has difficulty swallowing. Which nursing interventions are appropriate? Select all that apply.",
opts:["Position upright during feeding","Provide small, frequent meals","Use thickened liquids as ordered","Feed quickly to prevent fatigue","Monitor for aspiration"],correct:[0,1,2,4],
r:"For dysphagia in cerebral palsy: upright positioning, small frequent meals, thickened liquids, and aspiration monitoring. Feeding should be slow and unhurried, not rushed."},
{topic:"Abnormal Pediatrics", q:"A child with spina bifida is at risk for latex allergy. Which items should be avoided? Select all that apply.",
opts:["Latex gloves","Latex balloons","Rubber toys","Bananas","Silicone catheters"],correct:[0,1,2,3],
r:"Children with spina bifida have a high risk of latex sensitization. Latex gloves, balloons, and rubber toys should be avoided. Foods such as bananas, avocado, and kiwi may cross-react in people with latex-fruit syndrome, but they do not need to be universally restricted unless the child has symptoms or documented allergy. Silicone catheters are latex-free alternatives."},
{topic:"Abnormal Pediatrics", q:"A child with Duchenne muscular dystrophy is admitted. Which findings are expected? Select all that apply.",
opts:["Progressive muscle weakness","Gowers' sign","Calf muscle hypertrophy","Improved muscle strength over time","Frequent falls"],correct:[0,1,2,4],
r:"Duchenne muscular dystrophy presents with progressive weakness, Gowers' sign (using hands to push up from the floor), pseudohypertrophy of the calves, and frequent falls. Strength does not improve over time."},
{topic:"Abnormal Pediatrics", q:"A child with Duchenne muscular dystrophy is prescribed prednisone. Which nursing interventions are appropriate? Select all that apply.",
opts:["Monitor for signs of infection","Monitor blood glucose","Encourage a low-sodium diet","Administer live vaccines","Monitor for weight gain"],correct:[0,1,2,4],
r:"Prednisone therapy requires monitoring for infection, hyperglycemia, fluid retention, and weight gain; dietary sodium may need moderation when clinically indicated. Live vaccines should be avoided during sufficiently high-dose or otherwise significant immunosuppressive corticosteroid therapy, according to current immunization guidance."},
{topic:"Abnormal Pediatrics", q:"A child with juvenile idiopathic arthritis (JIA) is admitted. Which findings are expected? Select all that apply.",
opts:["Joint pain and swelling","Morning stiffness","Decreased range of motion","Increased appetite","Fever"],correct:[0,1,2,4],
r:"JIA presents with joint pain/swelling, morning stiffness, decreased ROM, and fever. Appetite is typically decreased, not increased."},
{topic:"Abnormal Pediatrics", q:"A child with juvenile idiopathic arthritis is prescribed NSAIDs. Which instructions should the nurse include? Select all that apply.",
opts:["Take with food to reduce GI upset","Report black stools","Monitor for bleeding","Take on an empty stomach for best absorption","Attend regular follow-up appointments"],correct:[0,1,2,4],
r:"NSAIDs should be taken with food, and clients should report black stools or bleeding. Taking on an empty stomach increases GI irritation and is not recommended."},
{topic:"Abnormal Pediatrics", q:"A child with type 1 diabetes mellitus is admitted. Which findings indicate hypoglycemia? Select all that apply.",
opts:["Shakiness","Sweating","Confusion","Polyuria","Tachycardia"],correct:[0,1,2,4],
r:"Hypoglycemia presents with shakiness, sweating, confusion, tachycardia, and hunger. Polyuria is a sign of hyperglycemia, not hypoglycemia."},
{topic:"Abnormal Pediatrics", q:"A child with type 1 diabetes is experiencing hypoglycemia and is conscious. What is the priority nursing action?",
opts:["Administer insulin","Give 15 g of a fast-acting carbohydrate","Withhold all oral intake","Administer glucagon IM"],correct:1,
r:"For conscious hypoglycemia, the rule of 15 applies: give 15 g of fast-acting carbohydrate, wait 15 minutes, recheck glucose, and repeat if needed. Insulin would worsen hypoglycemia."},
{topic:"Abnormal Pediatrics", q:"A child with type 1 diabetes is unconscious due to severe hypoglycemia. What is the priority nursing action?",
opts:["Give oral glucose gel","Administer glucagon IM/SC or intranasally as appropriate, or IV dextrose if IV access is available","Administer insulin","Place the child in a supine position and monitor"],correct:1,
r:"Unconscious children should not receive oral glucose because of aspiration risk. If IV access is available, IV dextrose is the usual treatment; glucagon may be given IM, SC, or intranasally when appropriate, particularly when IV access is unavailable."},
{topic:"Abnormal Pediatrics", q:"Which findings indicate diabetic ketoacidosis (DKA) in a child? Select all that apply.",
opts:["Hyperglycemia","Ketonuria","Metabolic acidosis","Deep, rapid breathing (Kussmaul)","Bradycardia"],correct:[0,1,2,3],
r:"DKA presents with hyperglycemia, ketonuria, metabolic acidosis, Kussmaul respirations, dehydration, and fruity breath. Tachycardia, not bradycardia, is typical."},
{topic:"Abnormal Pediatrics", q:"A child with DKA is receiving IV fluids and insulin. Which findings indicate improvement? Select all that apply.",
opts:["Decreasing blood glucose","Improving pH","Decreasing ketones","Increased urine output","Decreasing level of consciousness"],correct:[0,1,2,3],
r:"DKA improvement: decreasing glucose, improving pH, decreasing ketones, and increasing urine output. A decreasing level of consciousness indicates worsening and requires immediate intervention."},
{topic:"Abnormal Pediatrics", q:"A child with hypothyroidism is started on levothyroxine. Which instructions should the nurse include? Select all that apply.",
opts:["Administer it consistently, preferably on an empty stomach as prescribed","For an infant unable to swallow a tablet, give the properly crushed tablet in a small amount of water as directed","Monitor for signs of excessive thyroid hormone","Change the dosing time frequently","Attend regular follow-up for growth and thyroid-function monitoring"],correct:[0,1,2,4],
r:"Levothyroxine should be administered consistently according to the prescribed schedule. Infants who cannot swallow tablets may receive a properly crushed tablet prepared as directed; it should not be mixed indiscriminately into formula or food because absorption can be affected. Monitor for excessive thyroid hormone and follow growth and laboratory results."},
{topic:"Abnormal Pediatrics", q:"Which findings indicate congenital hypothyroidism in a newborn? Select all that apply.",
opts:["Prolonged jaundice","Constipation","Poor feeding","Hoarse cry","Hyperactivity"],correct:[0,1,2,3],
r:"Congenital hypothyroidism presents with prolonged jaundice, constipation, poor feeding, hoarse cry, and lethargy. Hyperactivity suggests hyperthyroidism, not hypothyroidism."},
{topic:"Abnormal Pediatrics", q:"A child with phenylketonuria (PKU) is admitted. Which dietary restrictions are appropriate? Select all that apply.",
opts:["Avoid high-protein foods","Avoid aspartame","Use special formula","Restrict phenylalanine intake","Encourage a high-protein diet"],correct:[0,1,2,3],
r:"PKU management: avoid high-protein foods, aspartame (contains phenylalanine), use special formula, and restrict phenylalanine. A high-protein diet is contraindicated."},
{topic:"Abnormal Pediatrics", q:"A child with classic galactosemia is admitted. Which dietary restrictions are appropriate? Select all that apply.",
opts:["Avoid breast milk","Avoid cow's milk and other lactose-containing dairy products","Use a lactose-free, galactose-restricted formula such as an appropriate soy-based formula","Use a galactose-containing formula","Encourage regular dairy products"],correct:[0,1,2],
r:"Classic galactosemia requires lifelong restriction of galactose, including avoidance of lactose-containing breast milk and dairy products. Lactose-free soy-based formulas are commonly used alternatives because they do not contain lactose. Formula choice should follow the metabolic team's recommendations."},
{topic:"Abnormal Pediatrics", q:"A child with hemophilia A is admitted with a bleeding episode. Which interventions are appropriate? Select all that apply.",
opts:["Administer factor VIII as ordered","Apply ice to the affected area","Elevate the affected extremity","Administer aspirin for pain","Monitor for signs of internal bleeding"],correct:[0,1,2,4],
r:"For hemophilia A bleeding: factor VIII replacement, ice, elevation, and bleeding monitoring. Aspirin is contraindicated because it impairs platelet function and worsens bleeding."},
{topic:"Abnormal Pediatrics", q:"Which findings indicate von Willebrand disease? Select all that apply.",
opts:["Easy bruising","Prolonged bleeding time","Epistaxis","Normal platelet count","Thrombocytopenia"],correct:[0,1,2,3],
r:"Von Willebrand disease presents with easy bruising, prolonged bleeding time, epistaxis, and a normal platelet count. Thrombocytopenia is not characteristic."},
{topic:"Abnormal Pediatrics", q:"A child with leukemia is admitted. Which findings are expected? Select all that apply.",
opts:["Pallor and fatigue","Frequent infections","Bruising and petechiae","Bone pain","Polycythemia"],correct:[0,1,2,3],
r:"Leukemia presents with pallor/fatigue (anemia), frequent infections (neutropenia), bruising/petechiae (thrombocytopenia), and bone pain. Polycythemia is not characteristic."},
{topic:"Abnormal Pediatrics", q:"A nurse assesses a newborn for developmental dysplasia of the hip. Which finding, elicited via the Ortolani maneuver, suggests hip instability?",
opts:["A soft clicking sound only","A palpable 'clunk' as the femoral head reduces into the acetabulum","Symmetric hip abduction bilaterally","Absence of thigh skin folds"],correct:1,
r:"A palpable 'clunk' during the Ortolani maneuver indicates the dislocated femoral head is being reduced back into the acetabulum, suggesting developmental dysplasia of the hip."},
{topic:"Abnormal Pediatrics", q:"Which feeding position is most appropriate for an infant with a cleft palate?",

{topic:"Abnormal Pediatrics", q:"A child with cerebral palsy is noted to have increased muscle tone and stiffness, with exaggerated reflexes. This describes which type of cerebral palsy?",
opts:["Spastic cerebral palsy","Athetoid (dyskinetic) cerebral palsy","Ataxic cerebral palsy","Hypotonic cerebral palsy"],correct:0,
r:"Spastic cerebral palsy, the most common type, is characterized by increased muscle tone (hypertonia), stiffness, and hyperactive reflexes due to damage to the motor cortex."},
{topic:"Abnormal Pediatrics", q:"A child with sickle cell disease presents with severe pain in the extremities during a vaso-occlusive crisis. Which nursing intervention is a priority?",

r:"Intussusception, telescoping of one segment of bowel into another, classically presents with episodic colicky abdominal pain, knees drawn to chest, and red 'currant jelly' stools from bowel wall ischemia and mucus."},
{topic:"Abnormal Pediatrics", q:"A newborn fails to pass meconium within 48 hours of birth and has abdominal distention. This is most suggestive of:",

{topic:"Abnormal Pediatrics", q:"An infant is diagnosed with RSV bronchiolitis. Which nursing intervention is most appropriate?",

{topic:"Abnormal Pediatrics", q:"A child is diagnosed with idiopathic thrombocytopenic purpura (ITP). Which findings are expected? Select all that apply.",

const topics = [...new Set(BANK.map(q=>q.topic))];
const topicListEl = document.getElementById('topicList');
topics.forEach(t=>{
  const count = BANK.filter(q=>q.topic===t).length;
  const div = document.createElement('div');
  div.className='topic';
  div.innerHTML = `<label><input type="checkbox" class="topicChk" value="${t}" checked style="margin-right:10px;transform:scale(1.2);">${t} <span style="color:var(--sub);font-size:.82rem;">(${count})</span></label>`;
  topicListEl.appendChild(div);
});

function selectedTopics(){
  return [...document.querySelectorAll('.topicChk:checked')].map(c=>c.value);
}
function updateMax(){
  const sel = selectedTopics();
  const avail = BANK.filter(q=>sel.includes(q.topic)).length;
  document.getElementById('maxAvail').textContent = 'of ' + avail + ' available';
  document.getElementById('itemCount').max = avail || 1;
}
document.addEventListener('change', e=>{ if(e.target.classList.contains('topicChk')) updateMax(); });
updateMax();

let quizQs = [], current = 0, score = 0;
let mode = 'practice';
let timerId = null, timeLeft = 0, elapsed = 0;
let answers = []; // {q, chosen, correct}

document.getElementById('startBtn').onclick = ()=>{
  const sel = selectedTopics();
  if(sel.length===0){ alert('Pick at least one topic.'); return; }
  const modeInput = document.querySelector('input[name="mode"]:checked');
  mode = modeInput ? modeInput.value : 'practice';
  const pool = BANK.filter(q=>sel.includes(q.topic));
  let n = parseInt(document.getElementById('itemCount').value) || 10;
  n = Math.min(n, pool.length);
  quizQs = [...pool].sort(()=>Math.random()-0.5).slice(0,n);
  current = 0; score = 0; answers = [];
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  document.getElementById('timer').classList.toggle('hidden', mode!=='timed');
  if(mode==='timed'){ timeLeft = quizQs.length*60; elapsed = 0; startTimer(); }
  else { startElapsed(); }
  showQuestion();
};

function startTimer(){
  clearInterval(timerId);
  updateTimerDisplay();
  timerId = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){ clearInterval(timerId); finishExam(true); }
  },1000);
}
function startElapsed(){
  clearInterval(timerId); elapsed = 0;
  document.getElementById('timer').textContent = '⏱ 00:00';
  timerId = setInterval(()=>{ elapsed++; updateTimerDisplay(); },1000);
}
function updateTimerDisplay(){
  const el = document.getElementById('timer');
  const t = mode==='timed' ? timeLeft : elapsed;
  const m = String(Math.floor(t/60)).padStart(2,'0');
  const s = String(t%60).padStart(2,'0');
  el.textContent = '⏱ ' + m + ':' + s;
  el.classList.toggle('warn', mode==='timed' && timeLeft<=30);
}

function showQuestion(){
  const q = quizQs[current];
  document.getElementById('progress').textContent = `Question ${current+1} of ${quizQs.length}`;
  document.getElementById('qTopic').textContent = q.topic;
  const isSATA = Array.isArray(q.correct);
  document.getElementById('qText').textContent = q.q + (isSATA ? " (Select all that apply)" : "");
  const optDiv = document.getElementById('options');
  optDiv.innerHTML='';
  const rat = document.getElementById('rationale');
  rat.style.display='none';
  document.getElementById('nextBtn').classList.add('hidden');

  if(isSATA){
    q.opts.forEach((opt,i)=>{
      const btn = document.createElement('button');
      btn.className='opt';
      btn.textContent = opt;
      btn.dataset.idx = i;
      btn.onclick = ()=> btn.classList.toggle('selected');
      optDiv.appendChild(btn);
    });
    const submit = document.createElement('button');
    submit.className='btn-primary';
    submit.textContent='Submit Answer';
    submit.onclick = ()=>{
      const chosen = [...optDiv.querySelectorAll('.opt.selected')].map(b=>parseInt(b.dataset.idx));
      gradeSATA(chosen, q);
      submit.remove();
    };
    optDiv.appendChild(submit);
  } else {
    q.opts.forEach((opt,i)=>{
      const btn = document.createElement('button');
      btn.className='opt';
      btn.textContent = opt;
      btn.onclick = ()=> selectAnswer(i);
      optDiv.appendChild(btn);
    });
  }
}

function gradeSATA(chosen, q){
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  const correctArr = q.correct;
  const isCorrect = chosen.length === correctArr.length && chosen.every(c=>correctArr.includes(c));
  correctArr.forEach(i=> btns[i].classList.add('correct'));
  chosen.forEach(i=>{ if(!correctArr.includes(i)) btns[i].classList.add('wrong'); });
  if(isCorrect) score++;
  answers.push({q, chosen, correct:isCorrect});
  const rat = document.getElementById('rationale');
  rat.textContent = 'Rationale: ' + q.r;
  rat.style.display='block';
  document.getElementById('nextBtn').classList.remove('hidden');
}

function selectAnswer(i){
  const q = quizQs[current];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  btns[q.correct].classList.add('correct');
  const isCorrect = i===q.correct;
  if(!isCorrect){ btns[i].classList.add('wrong'); } else { score++; }
  answers.push({q, chosen:i, correct:isCorrect});
  const rat = document.getElementById('rationale');
  rat.textContent = 'Rationale: ' + q.r;
  rat.style.display='block';
  document.getElementById('nextBtn').classList.remove('hidden');
}

document.getElementById('nextBtn').onclick = ()=>{
  current++;
  if(current < quizQs.length){ showQuestion(); }
  else { finishExam(false); }
};

function finishExam(timedOut){
  clearInterval(timerId);
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('results').classList.remove('hidden');
  const total = quizQs.length;
  const pct = total ? Math.round((score/total)*100) : 0;
  document.getElementById('scoreText').textContent = timedOut ? `⏱ Time's up — ${score} / ${total}` : `${score} / ${total}`;
  document.getElementById('scoreDetail').textContent = `${pct}% correct`;

  // Per-topic breakdown
  const byTopic = {};
  answers.forEach(a=>{
    const t = a.q.topic;
    if(!byTopic[t]) byTopic[t] = {correct:0, total:0};
    byTopic[t].total++;
    if(a.correct) byTopic[t].correct++;
  });
  const breakdown = document.getElementById('topicBreakdown');
  breakdown.innerHTML = '';
  Object.keys(byTopic).sort().forEach(t=>{
    const {correct, total} = byTopic[t];
    const p = Math.round((correct/total)*100);
    const row = document.createElement('div');
    row.className = 'topic-row';
    row.innerHTML = `<div style="flex:1;">
        <div>${t} — ${correct}/${total} (${p}%)</div>
        <div class="topic-bar"><div style="width:${p}%;"></div></div>
      </div>`;
    breakdown.appendChild(row);
  });

  // Review card
  const missed = answers.filter(a=>!a.correct);
  const reviewCard = document.getElementById('reviewCard');
  const reviewList = document.getElementById('reviewList');
  reviewList.innerHTML = '';
  if(missed.length === 0){
    reviewCard.classList.add('hidden');
    document.getElementById('reviewBtn').classList.add('hidden');
  } else {
    reviewCard.classList.remove('hidden');
    document.getElementById('reviewBtn').classList.remove('hidden');
    missed.forEach(a=>{
      const item = document.createElement('div');
      item.className = 'review-item';
      const correctText = Array.isArray(a.q.correct)
        ? a.q.correct.map(i=>a.q.opts[i]).join('; ')
        : a.q.opts[a.q.correct];
      const yoursText = Array.isArray(a.chosen)
        ? (a.chosen.length ? a.chosen.map(i=>a.q.opts[i]).join('; ') : '(no answer)')
        : a.q.opts[a.chosen];
      item.innerHTML = `<div class="q">${a.q.q}</div>
        <div class="yours">Your answer: ${yoursText}</div>
        <div class="ans">Correct: ${correctText}</div>
        <div class="rat">${a.q.r}</div>`;
      reviewList.appendChild(item);
    });
  }

  // Save to localStorage for progress history
  saveHistory({
    date: Date.now(),
    mode,
    score, total,
    byTopic
  });
}

document.getElementById('reviewBtn').onclick = ()=>{
  const c = document.getElementById('reviewCard');
  c.classList.toggle('hidden');
  document.getElementById('reviewBtn').textContent =
    c.classList.contains('hidden') ? 'Review Missed Questions' : 'Hide Review';
};

document.getElementById('restartBtn').onclick = ()=>{
  clearInterval(timerId);
  document.getElementById('results').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
  updateMax();
};

/* ---- Progress history (localStorage) ---- */
const HISTORY_KEY = 'nle_history_v1';
function saveHistory(entry){
  try{
    const hist = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    hist.push(entry);
    // keep last 50 attempts
    while(hist.length > 50) hist.shift();
    localStorage.setItem(HISTORY_KEY, JSON.stringify(hist));
    renderHistory();
  }catch(e){ console.warn('history save failed', e); }
}
function getHistory(){
  try{ return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch(e){ return []; }
}
function renderHistory(){
  const hist = getHistory();
  const wrap = document.getElementById('historyCard');
  const list = document.getElementById('historyList');
  if(!wrap) return;
  if(hist.length === 0){ wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  list.innerHTML = '';
  hist.slice().reverse().slice(0,10).forEach(h=>{
    const d = new Date(h.date);
    const row = document.createElement('div');
    row.className = 'topic-row';
    row.innerHTML = `<span>${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})} · ${h.mode}</span>
      <strong>${h.score}/${h.total}</strong>`;
    list.appendChild(row);
  });

}
renderHistory();
</script>
