<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f6f4f">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>NLE Review Quiz</title>
<style>
:root{
  --bg:#f7f5f2; --card:#ffffff; --ink:#1f2430; --sub:#6b7280;
  --accent:#2f6f4f; --accent2:#c96a3a; --bad:#c0392b; --good:#2f6f4f;
  --border:#e5e1da;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c; --card:#1e2128; --ink:#eceef1; --sub:#9aa1ac; --border:#2c303a;
  }
}
:root[data-theme="dark"]{
  --bg:#15171c; --card:#1e2128; --ink:#eceef1; --sub:#9aa1ac; --border:#2c303a;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px;}
h1{font-size:1.4rem;margin:8px 0 2px;}
.sub{color:var(--sub);font-size:.9rem;margin-bottom:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;}
.topic{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--border);}
.topic:last-child{border-bottom:none;}
.topic label{font-size:.98rem;}
.count-row{display:flex;align-items:center;gap:12px;margin-top:6px;}
input[type=number]{width:80px;padding:8px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-size:1rem;}
button{border:none;border-radius:12px;padding:13px 18px;font-size:1rem;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:16px;}
.btn-secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);width:100%;margin-top:10px;}
.tag{display:inline-block;font-size:.72rem;color:var(--accent);background:rgba(47,111,79,.12);padding:3px 9px;border-radius:99px;margin-bottom:10px;}
.qtext{font-size:1.05rem;line-height:1.5;margin-bottom:16px;}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:.96rem;color:var(--ink);}
.opt.correct{border-color:var(--good);background:rgba(47,111,79,.12);}
.opt.wrong{border-color:var(--bad);background:rgba(192,57,38,.12);}
.opt:disabled{opacity:.85;}
.opt.selected{border-color:var(--accent);background:rgba(47,111,79,.18);}
.rationale{margin-top:14px;padding:12px 14px;background:var(--bg);border-radius:12px;border:1px solid var(--border);font-size:.9rem;line-height:1.5;color:var(--sub);display:none;}
.progress{font-size:.82rem;color:var(--sub);margin-bottom:8px;}
.hidden{display:none;}
.score{font-size:2.2rem;font-weight:700;color:var(--accent);margin:6px 0;}
.quizbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.timer{font-size:.85rem;font-weight:600;color:var(--accent2);font-variant-numeric:tabular-nums;}
.timer.warn{color:var(--bad);}
.topic-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:.9rem;}
.topic-row:last-child{border-bottom:none;}
.topic-bar{height:6px;border-radius:3px;background:var(--border);margin-top:4px;overflow:hidden;}
.topic-bar > div{height:100%;background:var(--accent);border-radius:3px;}
.review-item{padding:12px 0;border-bottom:1px solid var(--border);font-size:.9rem;line-height:1.5;}
.review-item:last-child{border-bottom:none;}
.review-item .q{font-weight:600;margin-bottom:6px;}
.review-item .ans{color:var(--good);}
.review-item .yours{color:var(--bad);}
.review-item .rat{color:var(--sub);font-size:.85rem;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">

<div id="setup">
  <h1>🩺 NLE Review</h1>
  <div class="sub">Original practice questions with rationales — pick your topics.</div>
  <div class="card" id="topicList"></div>
  <div class="card">
    <label style="font-weight:600;">Number of items</label>
    <div class="count-row">
      <input type="number" id="itemCount" min="1" value="10">
      <span class="sub" id="maxAvail"></span>
    </div>
  </div>
  <div class="card">
    <label style="font-weight:600;">Mode</label>
    <div class="count-row">
      <label><input type="radio" name="mode" value="practice" checked> Practice (no timer)</label>
    </div>
    <div class="count-row">
      <label><input type="radio" name="mode" value="timed"> Timed Exam (1 min per item)</label>
    </div>
  </div>
  <div class="card hidden" id="historyCard">
    <div class="sub" style="margin-bottom:8px;">Recent attempts</div>
    <div id="historyList"></div>
  </div>
  <button class="btn-primary" id="startBtn">Start Exam</button>
</div>

<div id="quiz" class="hidden">
  <div class="quizbar">
    <div class="progress" id="progress"></div>
    <div class="timer hidden" id="timer">⏱ 00:00</div>
  </div>
  <div class="card">
    <span class="tag" id="qTopic"></span>
    <div class="qtext" id="qText"></div>
    <div id="options"></div>
    <div class="rationale" id="rationale"></div>
  </div>
  <button class="btn-primary hidden" id="nextBtn">Next Question</button>
</div>

<div id="results" class="hidden">
  <div class="card" style="text-align:center;">
    <div class="sub">Your score</div>
    <div class="score" id="scoreText"></div>
    <div class="sub" id="scoreDetail"></div>
  </div>
  <div class="card" id="weakTopicsCard">
    <div class="sub" style="margin-bottom:8px;">Performance by topic</div>
    <div id="topicBreakdown"></div>
  </div>
  <div class="card hidden" id="reviewCard">
    <div class="sub" style="margin-bottom:8px;">Review missed questions</div>
    <div id="reviewList"></div>
  </div>
  <button class="btn-secondary" id="reviewBtn">Review Missed Questions</button>
  <button class="btn-primary" id="restartBtn">New Exam</button>
</div>

</div>

<script>
const BANK = [
// ---------- Normal Obstetrics Nursing ----------
{topic:"Obstetrics", q:"A client at 32 weeks AOG presents with sudden, painless, bright-red vaginal bleeding. The uterus is soft and nontender. Which condition should the nurse suspect?",
opts:["Placenta previa","Abruptio placentae","Ectopic pregnancy","Preterm labor"],correct:0,
r:"Painless, bright-red vaginal bleeding in the 3rd trimester is the classic presentation of placenta previa. In contrast, abruptio placentae typically presents with painful vaginal bleeding accompanied by a tender, firm or rigid uterus."},
{topic:"Obstetrics", q:"A client at 32 weeks AOG develops sudden-onset abdominal pain, dark-red vaginal bleeding, and a tender, rigid uterus. Which condition should the nurse suspect?",
opts:["Placenta previa","Abruptio placentae","Ectopic pregnancy","Preterm labor"],correct:1,
r:"Abruptio placentae is the premature separation of a normally implanted placenta from the uterine wall before delivery. It classically presents with sudden abdominal or uterine pain, vaginal bleeding, and a tender, firm or rigid uterus. The bleeding is often dark red, although the amount of visible vaginal bleeding may underestimate the actual blood loss because blood can accumulate behind the placenta (concealed hemorrhage)."},
{topic:"Obstetrics", q:"Which finding in a postpartum client 2 hours after delivery requires immediate nursing action?",
opts:["Fundus firm, at the level of the umbilicus","Lochia rubra, moderate amount","Boggy fundus displaced to the right of midline","Mild afterpains"],correct:2,
r:"A boggy, displaced fundus suggests a full bladder or uterine atony, both of which increase the risk of postpartum hemorrhage. The nurse should have the client void and reassess, then massage the fundus if it remains boggy."},
{topic:"Obstetrics", q:"A pregnant client at 34 weeks AOG has a blood pressure of 150/96 mmHg on appropriate repeat measurement and 2+ proteinuria. She has no severe symptoms or laboratory findings indicating end-organ dysfunction. How should this condition be classified?",
opts:["Chronic hypertension","Gestational hypertension","Preeclampsia without severe features","Eclampsia"],correct:2,
r:"New-onset hypertension (≥140/90) plus proteinuria after 20 weeks, without severe features like visual changes, epigastric pain, or very high BP, is classified as preeclampsia without severe features."},
{topic:"Obstetrics", q:"During the second stage of labor, which maternal behavior is expected?",
opts:["Increased urge to push with contractions","Complete loss of contraction sensation","Sudden decrease in contraction frequency","Rupture of membranes is required to begin this stage"],correct:0,
r:"The second stage (full dilation to delivery) is marked by an involuntary urge to bear down with each contraction as the fetal head descends and puts pressure on the rectum."},
{topic:"Obstetrics", q:"A nurse is teaching a client about the expected changes in lochia after delivery. Which sequence is correct?",
opts:["Alba → Serosa → Rubra","Rubra → Serosa → Alba","Serosa → Rubra → Alba","Alba → Rubra → Serosa"],correct:1,
r:"Lochia progresses from rubra (red, days 1–3) to serosa (pinkish-brown, days 4–10) to alba (yellowish-white, days 10–14 up to 6 weeks) as the endometrium heals."},
{topic:"Obstetrics", q:"Which client is at highest risk for developing gestational diabetes mellitus?",
opts:["22 years old, BMI 21, first pregnancy","35 years old, BMI 32, previous macrosomic baby","28 years old, BMI 23, twin pregnancy diagnosed at 30 weeks","30 years old, BMI 24, no prior pregnancies"],correct:1,
r:"Advanced maternal age, obesity (BMI ≥30), and a history of delivering a macrosomic infant (>4kg) are major risk factors for gestational diabetes."},

{topic:"Obstetrics", q:"A client's LMP was June 10. Using Naegele's rule, what is the estimated date of delivery?",
opts:["March 3 (next year)","March 17 (next year)","April 10 (next year)","February 17 (next year)"],correct:1,
r:"Naegele's rule: subtract 3 months, add 7 days, adjust the year. June 10 − 3 months = March 10; +7 days = March 17."},
{topic:"Obstetrics", q:"What is the primary purpose of performing Leopold's maneuvers?",
opts:["To assess fetal heart tones only","To determine fetal lie, presentation, position, and estimated size","To measure cervical dilation","To assess amniotic fluid volume"],correct:1,
r:"Leopold's maneuvers are a systematic abdominal palpation technique used to identify fetal lie, presentation, position, and approximate size before determining where to auscultate fetal heart tones."},
{topic:"Obstetrics", q:"Which finding differentiates true labor from false (Braxton Hicks) contractions?",
opts:["Contractions felt in the abdomen only","Contractions that decrease with walking or position change","Progressive cervical dilation and effacement with contractions","Irregular contraction intervals that do not intensify"],correct:2,
r:"True labor contractions cause progressive cervical change (dilation and effacement) and intensify with time and activity, unlike false labor, which is irregular and often eases with walking or rest."},
{topic:"Obstetrics", q:"An Rh-negative mother delivers an Rh-positive infant. When should Rho(D) immune globulin (RhoGAM) be administered postpartum?",
opts:["Within 72 hours after delivery","Within 2 weeks after delivery","Only if a second pregnancy is planned","Immediately before delivery"],correct:0,
r:"RhoGAM should be given within 72 hours postpartum (and also during pregnancy at ~28 weeks) to prevent maternal sensitization from fetal Rh-positive blood exposure, protecting future pregnancies."},
{topic:"Obstetrics", q:"Which parameter is NOT part of the APGAR scoring system?",
opts:["Heart rate","Respiratory effort","Muscle tone","Birth weight"],correct:3,
r:"APGAR assesses Appearance (color), Pulse (heart rate), Grimace (reflex irritability), Activity (muscle tone), and Respiration — birth weight is not part of the scoring system."},
{topic:"Obstetrics", q:"Which hormone is primarily responsible for the milk let-down (ejection) reflex during breastfeeding?",
opts:["Prolactin","Oxytocin","Estrogen","Progesterone"],correct:1,
r:"Oxytocin causes contraction of myoepithelial cells around the alveoli, triggering milk ejection. Prolactin, in contrast, stimulates milk production/synthesis."},
{topic:"Obstetrics", q:"A primigravida asks the nurse what 'lightening' means. The best response is:",
opts:["The fetus has stopped moving as often","The fetal head has descended into the pelvic inlet","Labor contractions have become painless","The amniotic sac has ruptured"],correct:1,
r:"Lightening refers to the fetal presenting part (usually the head) descending into the pelvic inlet, often occurring 2–4 weeks before labor in primigravidas, relieving pressure on the diaphragm."},
{topic:"Obstetrics", q:"A nurse is teaching perineal care to a postpartum client with an episiotomy. Which instruction is correct?",
opts:["Wipe from back to front after voiding","Use a peri-bottle with warm water, spraying front to back","Apply ice packs continuously for the first week","Avoid changing perineal pads more than twice a day"],correct:1,
r:"Peri-bottle irrigation from front to back after voiding/defecating cleanses the perineum without introducing rectal flora to the episiotomy site, reducing infection risk."},
{topic:"Obstetrics", q:"On postpartum day 1, the nurse palpates the fundus at the level of the umbilicus. By postpartum day 3, where should the fundus be located?",
opts:["Still at the umbilicus","2 fingerbreadths above the umbilicus","About 3 fingerbreadths below the umbilicus","No longer palpable"],correct:2,
r:"The fundus descends about 1 fingerbreadth (1 cm) per day after delivery, so by day 3 it should be roughly 3 fingerbreadths below the umbilicus as involution progresses."},
{topic:"Obstetrics", q:"Which symptom reported by a pregnant client in the third trimester is a danger sign requiring immediate follow-up?",
opts:["Mild ankle edema at end of day","Occasional Braxton Hicks contractions","Severe headache with blurred vision","Increased urinary frequency"],correct:2,
r:"Severe headache with visual disturbances can indicate worsening preeclampsia progressing toward eclampsia, and requires immediate evaluation of blood pressure and neurologic status."},
{topic:"Obstetrics", q:"A client at 28 weeks AOG comes for a prenatal check. The nurse notes a fundal height of 24 cm. What is the most appropriate nursing action?",
opts:["Document as normal for AOG","Notify the physician; this may indicate fetal growth restriction or inaccurate dating","Reassure the client that fundal height is unrelated to AOG","Schedule the next visit in 6 weeks"],correct:1,
r:"Between 18–32 weeks, fundal height in cm roughly equals AOG in weeks (±2 cm). A 4 cm discrepancy warrants further evaluation for intrauterine growth restriction, oligohydramnios, or dating error."},
{topic:"Obstetrics", q:"Which of the following are TRUE statements about the first stage of labor? Select all that apply.",
opts:["It begins with the onset of regular contractions and ends with full cervical dilation","It is divided into latent and active phases","The latent phase is typically the fastest phase of the first stage","It ends with delivery of the baby"],correct:[0,1],
r:"The first stage spans onset of true labor to full dilation (10 cm), divided into latent (0–6 cm) and active (6–10 cm) phases. The latent phase is usually the LONGEST, and delivery of the baby occurs in the second stage."},
{topic:"Obstetrics", q:"A nurse is monitoring a client in labor. Which findings indicate true labor? Select all that apply.",
opts:["Contractions become stronger with ambulation","Contractions are regular and progressively closer together","Cervical dilation and effacement progress with contractions","Contractions are relieved by position changes","Discomfort is usually felt in the abdomen only"],correct:[0,1,2],
r:"True labor is characterized by regular, intensifying contractions that worsen with activity, and progressive cervical change. False labor eases with position change, and true labor pain is typically felt in the back radiating to the abdomen."},
{topic:"Obstetrics", q:"A client at 36 weeks has a biophysical profile (BPP). Which parameters are assessed in this test? Select all that apply.",
opts:["Fetal breathing movements","Fetal tone","Amniotic fluid volume","Maternal blood pressure","Nonstress test (fetal heart rate reactivity)"],correct:[0,1,2,4],
r:"The BPP assesses five components: fetal breathing, fetal movement, fetal tone, amniotic fluid volume, and a nonstress test (FHR reactivity). Maternal blood pressure is not part of the BPP."},
{topic:"Obstetrics", q:"During the immediate postpartum period, which interventions should the nurse perform within the first hour after delivery? Select all that apply.",
opts:["Assess the fundus and lochia every 15 minutes","Apply ice to the perineum if there is an episiotomy","Encourage the mother to void within the first hour","Initiate breastfeeding within the first hour if possible","Withhold all maternal oral intake for 24 hours"],correct:[0,1,3],
r:"The first postpartum hour requires frequent fundal/lochia assessment, perineal comfort measures, and early breastfeeding initiation. Voiding is encouraged but typically within 6–8 hours, not strictly the first hour. Oral intake is not withheld unnecessarily."},
{topic:"Obstetrics", q:"Which signs may indicate that a postpartum client is experiencing hypovolemic shock? Select all that apply.",
opts:["Tachycardia","Bradycardia","Decreased blood pressure","Warm, flushed skin","Restlessness and anxiety"],correct:[0,2,4],
r:"Hypovolemic shock presents with tachycardia, hypotension, cool/clammy skin, and restlessness. Bradycardia and warm flushed skin are not typical findings of shock."},
{topic:"Obstetrics", q:"A nurse is teaching a pregnant client about warning signs that require immediate reporting. Which should be included? Select all that apply.",
opts:["Vaginal bleeding","Severe abdominal pain","Persistent headache with visual changes","Mild ankle swelling at the end of the day","Decreased fetal movement"],correct:[0,1,2,4],
r:"Bleeding, severe abdominal pain, headache with visual changes, and decreased fetal movement are danger signs. Mild dependent ankle edema is a common, expected third-trimester finding."},
{topic:"Obstetrics", q:"A nurse is caring for a client with mild preeclampsia at 36 weeks. Which nursing interventions are appropriate? Select all that apply.",
opts:["Monitor blood pressure every 4 hours","Encourage a high-sodium diet","Assess deep tendon reflexes and for clonus","Restrict fluid intake to 1 L/day","Monitor for headache, visual changes, and epigastric pain"],correct:[0,2,4],
r:"For mild preeclampsia, the nurse monitors BP, neurologic status (DTRs, clonus), and symptoms of worsening disease. A high-sodium diet and fluid restriction are NOT indicated (sodium is not restricted, but fluids are encouraged)."},
{topic:"Obstetrics", q:"A client with severe preeclampsia is receiving magnesium sulfate IV. Which findings indicate magnesium toxicity? Select all that apply.",
opts:["Loss of deep tendon reflexes","Respiratory rate of 10 breaths/min","Urine output of 20 mL/hour","Serum magnesium level of 4 mg/dL","Decreased level of consciousness"],correct:[0,1,4],
r:"Magnesium toxicity signs include loss of DTRs, respiratory depression (<12/min), oliguria (<30 mL/hr), and CNS depression. A therapeutic serum magnesium level is 4–7 mg/dL; 4 mg/dL is within range."},
{topic:"Obstetrics", q:"A client receiving magnesium sulfate develops respiratory depression and loss of deep tendon reflexes. What is the priority nursing action?",
opts:["Increase the magnesium infusion rate","Discontinue the magnesium infusion and prepare to administer calcium gluconate","Administer a bolus of IV fluids","Place the client in Trendelenburg position"],correct:1,
r:"Magnesium sulfate toxicity is a medical emergency. The infusion must be stopped immediately, and calcium gluconate (the antidote) should be administered as ordered while supporting respiratory function."},
{topic:"Obstetrics", q:"A client at 34 weeks with placenta previa is admitted. Which nursing actions are appropriate? Select all that apply.",
opts:["Perform a sterile vaginal exam to assess dilation","Monitor fetal heart tones and maternal vital signs","Prepare for possible cesarean delivery","Assess the amount and character of vaginal bleeding","Encourage ambulation to promote comfort"],correct:[1,2,3],
r:"With placenta previa, digital/vaginal exams are CONTRAINDICATED due to risk of hemorrhage. The nurse monitors FHTs/vitals, bleeding, and prepares for possible cesarean. Ambulation may be restricted depending on bleeding."},
{topic:"Obstetrics", q:"A client is admitted with abruptio placentae. Which assessment findings are expected? Select all that apply.",
opts:["Painful vaginal bleeding","Board-like, tender abdomen","Painless bright red bleeding","Uterine tenderness on palpation","Fetal distress on monitoring"],correct:[0,1,3,4],
r:"Abruptio placentae presents with painful bleeding, a rigid/tender (board-like) uterus, and possible fetal distress. Painless bleeding is characteristic of placenta previa, not abruption."},
{topic:"Obstetrics", q:"Which are risk factors for ectopic pregnancy? Select all that apply.",
opts:["Previous pelvic inflammatory disease","History of tubal ligation or tubal surgery","Intrauterine device (IUD) in place","History of cesarean delivery","Multiple sexual partners"],correct:[0,1,2],
r:"Ectopic pregnancy risk factors include PID, prior tubal surgery/ligation, IUD use, and history of ectopic pregnancy. Cesarean delivery and multiple partners are not established risk factors."},
{topic:"Obstetrics", q:"A client with a suspected ectopic pregnancy reports sudden severe lower abdominal pain and shoulder pain. The nurse suspects:",
opts:["Normal pregnancy discomfort","Ruptured ectopic pregnancy with hemoperitoneum","Round ligament pain","Urinary tract infection"],correct:1,
r:"Sudden severe abdominal pain with referred shoulder pain (from diaphragmatic irritation by blood) suggests a ruptured ectopic pregnancy with intra-abdominal bleeding — a surgical emergency."},
{topic:"Obstetrics", q:"A nurse is assessing a client in the fourth stage of labor. Which finding requires immediate intervention?",
opts:["Fundus firm at the umbilicus","Lochia rubra moderate","Perineal pad saturated within 15 minutes","Blood pressure 110/70 mmHg"],correct:2,
r:"Saturating a perineal pad within 15 minutes indicates excessive bleeding (postpartum hemorrhage) and requires immediate assessment of the fundus, uterine tone, and possible retained placental fragments."},
{topic:"Obstetrics", q:"Which are causes of postpartum hemorrhage (the 4 T's)? Select all that apply.",
opts:["Tone (uterine atony)","Trauma (lacerations)","Tissue (retained placenta)","Thrombin (coagulopathy)","Temperature (fever)"],correct:[0,1,2,3],
r:"The 4 T's of postpartum hemorrhage are Tone (atony — most common), Trauma, Tissue (retained products), and Thrombin (coagulation defects). Fever is not part of this mnemonic."},
{topic:"Obstetrics", q:"A postpartum client's fundus is boggy and deviated to the right. What is the priority nursing action?",
opts:["Massage the fundus immediately","Have the client empty her bladder, then reassess the fundus","Notify the physician for possible hysterectomy","Place the client in Trendelenburg position"],correct:1,
r:"A boggy, right-deviated fundus usually indicates a full bladder displacing the uterus. The client should void (or be catheterized), then the fundus should be reassessed and massaged if still boggy."},
{topic:"Obstetrics", q:"Which interventions help prevent postpartum hemorrhage? Select all that apply.",
opts:["Administering uterotonics as ordered after delivery","Fundal massage after delivery of the placenta","Encouraging immediate breastfeeding","Assessing the fundus and lochia regularly","Restricting oral fluids postpartum"],correct:[0,1,2,3],
r:"Prevention includes uterotonics, fundal massage, early breastfeeding (stimulates oxytocin release), and frequent assessment. Fluid restriction does not prevent hemorrhage and is not indicated."},
{topic:"Obstetrics", q:"A client is scheduled for an amniocentesis at 16 weeks. Which nursing instruction is correct?",
opts:["Empty the bladder immediately before the procedure","Maintain a full bladder during the procedure","Avoid eating for 12 hours before the procedure","Expect results within 1 hour"],correct:0,
r:"The bladder should be emptied before amniocentesis to reduce the risk of bladder puncture and improve comfort. A full bladder is required for other procedures (e.g., early ultrasound), not amniocentesis."},
{topic:"Obstetrics", q:"Which finding defines a reactive nonstress test (NST)?",
opts:["Two or more FHR accelerations of ≥15 bpm lasting ≥15 seconds within 20 minutes","Fetal heart rate baseline of 140 bpm","No accelerations within 40 minutes","Late decelerations with contractions","Moderate variability"],correct:0,
r:"A reactive NST is defined by at least two FHR accelerations of ≥15 bpm lasting ≥15 seconds within a 20-minute period in a fetus at or beyond 32 weeks. Baseline and variability are also assessed, but they do not by themselves define a reactive NST."},
{topic:"Obstetrics", q:"A client at 38 weeks reports a sudden gush of clear fluid from the vagina. What is the priority nursing action?",
opts:["Perform a sterile vaginal exam to check dilation","Assess the fetal heart rate and the color/character of the fluid","Tell the client to go home and return if contractions begin","Administer a tocolytic agent"],correct:1,
r:"After spontaneous rupture of membranes (SROM), the priority is assessing fetal well-being (FHR) and the fluid (clear vs. meconium-stained), and monitoring for cord prolapse. Sterile vaginal exams are limited to reduce infection risk."},
{topic:"Obstetrics", q:"A client with premature rupture of membranes (PROM) at 34 weeks is admitted. Which nursing interventions are appropriate? Select all that apply.",
opts:["Monitor maternal temperature every 4 hours","Assess for uterine tenderness and foul-smelling discharge","Limit vaginal exams","Encourage frequent ambulation in the hallway","Monitor fetal heart rate"],correct:[0,1,2,4],
r:"With PROM, the nurse monitors for infection (temperature, uterine tenderness, foul discharge), limits vaginal exams to reduce infection risk, and monitors FHR. Bed rest is often recommended, not hallway ambulation."},
{topic:"Obstetrics", q:"Which conditions require a cesarean delivery? Select all that apply.",
opts:["Complete placenta previa","Active genital herpes lesions at onset of labor","Cord prolapse","Cephalic presentation at term","Fetal distress unresponsive to intrauterine resuscitation"],correct:[0,1,2,4],
r:"Cesarean is indicated for complete placenta previa, active herpes, cord prolapse, and unresponsive fetal distress. A normal cephalic presentation at term is not an indication for cesarean."},
{topic:"Obstetrics", q:"A client is recovering from a cesarean delivery. Which nursing interventions are appropriate? Select all that apply.",
opts:["Assess the incision for redness, drainage, and approximation","Encourage early ambulation to prevent thromboembolism","Splint the incision when coughing or deep breathing","Avoid assessing the fundus to prevent discomfort","Administer pain medication as ordered"],correct:[0,1,2,4],
r:"Post-cesarean care includes incision assessment, early ambulation, splinting for coughing, and analgesia. Fundal assessment is still performed — it is essential to monitor for hemorrhage."},
{topic:"Obstetrics", q:"A client at 10 weeks AOG reports nausea and vomiting. Which nursing suggestions are appropriate? Select all that apply.",
opts:["Eat small, frequent meals","Avoid greasy or spicy foods","Drink fluids between meals rather than with meals","Lie down immediately after eating","Try dry crackers before getting out of bed"],correct:[0,1,2,4],
r:"For morning sickness, small frequent meals, avoiding trigger foods, fluids between meals, and dry crackers before rising are helpful. Lying down immediately after eating can worsen nausea and reflux."},
{topic:"Obstetrics", q:"A nurse is assessing a client for hyperemesis gravidarum. Which findings support this diagnosis? Select all that apply.",
opts:["Weight loss of more than 5% of pre-pregnancy weight","Severe dehydration and electrolyte imbalance","Ketones in the urine","Mild nausea only in the morning","Persistent vomiting interfering with daily activities"],correct:[0,1,2,4],
r:"Hyperemesis gravidarum involves severe, persistent vomiting with weight loss, dehydration, electrolyte imbalance, and ketonuria. Mild morning nausea alone is normal pregnancy discomfort, not hyperemesis."},
{topic:"Obstetrics", q:"A client is receiving oxytocin for labor induction. Which findings require the nurse to stop the infusion? Select all that apply.",
opts:["Contractions lasting longer than 90 seconds","Uterine resting tone that remains firm between contractions","Fetal heart rate showing late decelerations","Contractions every 2–3 minutes lasting 40–60 seconds","Fetal bradycardia"],correct:[0,1,2,4],
r:"Oxytocin should be stopped for uterine hyperstimulation (contractions >90 sec or <2 min apart), increased resting tone, nonreassuring FHR patterns (late decelerations, bradycardia). Normal contractions every 2–3 min lasting 40–60 sec are expected."},
{topic:"Obstetrics", q:"Which are signs of cord prolapse? Select all that apply.",
opts:["Sudden fetal bradycardia after rupture of membranes","Visible or palpable cord at the introitus","Variable decelerations on FHR monitoring","Sudden onset of painless bleeding","Client reports feeling something in the vagina"],correct:[0,1,2,4],
r:"Cord prolapse presents with sudden fetal bradycardia or variable decelerations after ROM, a visible/palpable cord, and the sensation of something in the vagina. Painless bleeding suggests placenta previa, not cord prolapse."},
{topic:"Obstetrics", q:"A client is diagnosed with cord prolapse. What is the priority nursing action?",
opts:["Perform a sterile vaginal exam and push the cord back in","Place the client in Trendelenburg or knee-chest position and prepare for emergency cesarean","Administer oxytocin to speed delivery","Encourage the client to push with contractions"],correct:1,
r:"For cord prolapse, the nurse relieves cord compression by positioning the client in Trendelenburg or knee-chest position (or elevating the presenting part), and prepares for emergency cesarean. The cord should NOT be pushed back in."},
{topic:"Obstetrics", q:"Which are TRUE about the third stage of labor? Select all that apply.",
opts:["It begins after delivery of the baby and ends with delivery of the placenta","It typically lasts 5–30 minutes","Signs of placental separation include a gush of blood and lengthening of the cord","It is the longest stage of labor","The placenta is usually delivered within 30 minutes"],correct:[0,1,2,4],
r:"The third stage spans delivery of the baby to delivery of the placenta (usually 5–30 min). Signs of separation include a gush of blood, cord lengthening, and fundal elevation. The first stage is the longest; the third is the shortest."},
{topic:"Obstetrics", q:"A client reports severe perineal pain and a bulging, bluish mass at the perineum after delivery. The nurse suspects:",
opts:["Normal episiotomy healing","Vulvar hematoma","Uterine inversion","Cervical laceration"],correct:1,
r:"A vulvar hematoma presents as a painful, bulging, bluish mass at the perineum due to bleeding into the tissues. It requires prompt assessment and possible surgical evacuation."},
{topic:"Obstetrics", q:"Which are appropriate nursing interventions for a client with a fourth-degree perineal laceration? Select all that apply.",
opts:["Apply ice to the perineum for the first 24 hours","Administer stool softeners as ordered","Teach the client to avoid straining during defecation","Encourage sitz baths after 24 hours","Use a peri-bottle after voiding and defecation"],correct:[0,1,2,3,4],
r:"Fourth-degree lacerations (extending through the anal sphincter/rectum) require ice for the first 24 hours, stool softeners, avoiding straining, sitz baths after 24 hours, and peri-bottle use to prevent infection and promote healing."},
{topic:"Obstetrics", q:"A client at 20 weeks reports a white, cheesy vaginal discharge with itching. The nurse suspects:",
opts:["Bacterial vaginosis","Candidiasis (yeast infection)","Trichomoniasis","Normal leukorrhea"],correct:1,
r:"Candidiasis presents with thick, white, cheesy discharge and vulvovaginal itching. It is common in pregnancy due to hormonal changes and is treated with topical antifungals."},
{topic:"Obstetrics", q:"Which infections are associated with an increased risk of preterm labor? Select all that apply.",
opts:["Bacterial vaginosis","Chlamydia trachomatis","Trichomonas vaginalis","Asymptomatic bacteriuria","Group B Streptococcus colonization"],correct:[0,1,2,3,4],
r:"All of these infections have been associated with an increased risk of preterm labor, premature rupture of membranes, and other pregnancy complications. Screening and treatment are important components of prenatal care."},

// ---------- Normal Pediatrics Nursing ----------
{topic:"Pediatrics", q:"At what age does a healthy infant typically achieve head control while in a prone position?",
opts:["1 month","3–4 months","6 months","9 months"],correct:1,
r:"By 3–4 months, most infants can lift and hold their head steady when prone and briefly when pulled to sit, reflecting maturing neck extensor strength."},
{topic:"Pediatrics", q:"According to Erikson's psychosocial stages, a toddler (1–3 years) is primarily working through which developmental task?",
opts:["Trust vs. mistrust","Autonomy vs. shame and doubt","Initiative vs. guilt","Industry vs. inferiority"],correct:1,
r:"Toddlers develop autonomy through self-feeding, toileting, and asserting independence ('me do it'); overly restrictive caregiving can foster shame or doubt instead."},
{topic:"Pediatrics", q:"A nurse is teaching a mother about introducing solid foods to her 6-month-old. Which food should be avoided due to botulism risk?",
opts:["Mashed banana","Rice cereal","Honey","Pureed carrots"],correct:2,
r:"Honey may contain Clostridium botulinum spores that an infant's immature GI tract cannot destroy, risking infant botulism. It should be avoided until age 1."},
{topic:"Pediatrics", q:"Which immunization is routinely given at birth according to the Philippine Expanded Program on Immunization?",
opts:["MMR","BCG and Hepatitis B","OPV","Pentavalent vaccine"],correct:1,
r:"Under the Philippine EPI, BCG (against TB) and the first dose of Hepatitis B vaccine are given at birth, ideally within 24 hours."},
{topic:"Pediatrics", q:"A 4-year-old is admitted for a minor procedure. Which approach best supports the child's developmental needs (Erikson: initiative vs. guilt)?",
opts:["Allow the child to help set up simple, safe equipment","Complete all procedures quickly without explanation to reduce fear","Keep the child in bed at all times for safety","Discourage questions to avoid overstimulation"],correct:0,
r:"Preschoolers are developing initiative; giving them safe, simple choices and roles (like helping) supports this task and reduces feelings of guilt or helplessness."},
{topic:"Pediatrics", q:"Which is an expected physiologic finding in a healthy newborn within the first 24 hours?",
opts:["Respiratory rate of 20/min","Acrocyanosis of hands and feet","Bilateral red reflex absent","Continuous high-pitched crying"],correct:1,
r:"Acrocyanosis (bluish hands and feet with pink central body) is a normal newborn finding due to immature peripheral circulation and usually resolves within 24–48 hours."},

{topic:"Pediatrics", q:"According to Piaget, at approximately what age does an infant develop object permanence?",
opts:["1–2 months","4–5 months","8–9 months","18–24 months"],correct:2,
r:"Object permanence — understanding that objects continue to exist even when out of sight — typically develops around 8–9 months, within Piaget's sensorimotor stage."},
{topic:"Pediatrics", q:"Separation anxiety in infants typically peaks at what age?",
opts:["2–3 months","6–8 months","12–24 months","3–4 years"],correct:1,
r:"Separation anxiety commonly intensifies around 6–8 months, coinciding with the infant's growing cognitive ability to distinguish caregivers from strangers, and may persist into toddlerhood."},
{topic:"Pediatrics", q:"By what age does a healthy infant's birth weight typically double?",
opts:["2 months","5–6 months","12 months","18 months"],correct:1,
r:"Infants typically double their birth weight by 5–6 months and triple it by about 12 months, reflecting expected normal growth velocity."},
{topic:"Pediatrics", q:"At what age does the posterior fontanel normally close?",
opts:["6 weeks (2 months)","6 months","12 months","18 months"],correct:0,
r:"The posterior fontanel closes by about 2 months of age, while the larger anterior fontanel remains open until roughly 12–18 months."},
{topic:"Pediatrics", q:"Which type of play is most characteristic of a toddler (1–3 years)?",
opts:["Solitary play only","Parallel play","Cooperative play","Onlooker play only"],correct:1,
r:"Toddlers typically engage in parallel play — playing alongside other children with similar toys but without direct interaction or role coordination."},
{topic:"Pediatrics", q:"Which Erikson stage is a school-age child (6–12 years) working through?",
opts:["Autonomy vs. shame and doubt","Initiative vs. guilt","Industry vs. inferiority","Identity vs. role confusion"],correct:2,
r:"School-age children develop a sense of competence and accomplishment (industry) through mastering skills and tasks; failure to succeed can foster feelings of inferiority."},
{topic:"Pediatrics", q:"An adolescent client is primarily focused on peer acceptance and forming a sense of self. This reflects Erikson's stage of:",
opts:["Industry vs. inferiority","Identity vs. role confusion","Intimacy vs. isolation","Generativity vs. stagnation"],correct:1,
r:"Adolescence corresponds to Erikson's identity vs. role confusion stage, where teens explore values, roles, and relationships to consolidate a stable sense of self."},
{topic:"Pediatrics", q:"Why is iron-rich complementary food recommended beginning at approximately 6 months of age for healthy term infants?",
opts:["Breast milk contains no iron at all","Fetal iron stores from birth begin to deplete around this age","Infants can no longer digest lactose after 6 months","Iron prevents teething discomfort"],correct:1,
r:"Infants are born with iron stores that typically last about 6 months; after this, dietary iron (from fortified cereals, meats) is needed to prevent iron-deficiency anemia."},
{topic:"Pediatrics", q:"Current safety guidelines recommend keeping infants and toddlers in a rear-facing car seat until:",
opts:["3 months old","6 months old","At least 2 years old, or per seat's height/weight limit","5 years old"],correct:2,
r:"Rear-facing car seats better protect the head, neck, and spine in a crash; guidelines recommend keeping children rear-facing until at least age 2 or until they exceed the seat's manufacturer limits."},
{topic:"Pediatrics", q:"At approximately what age does the first primary (deciduous) tooth typically erupt?",
opts:["2 months","6 months","12 months","2 years"],correct:1,
r:"The first primary tooth (usually a lower central incisor) typically erupts around 6 months of age, though timing varies among healthy infants."},
{topic:"Pediatrics", q:"A nurse is assessing a 6-month-old infant. Which developmental milestones are expected at this age? Select all that apply.",
opts:["Sits with support","Rolls from front to back","Transfers objects from hand to hand","Walks independently","Bangs objects on a table"],correct:[0,1,2,4],
r:"By 6 months, infants typically sit with support, roll over, transfer objects between hands, and bang objects. Independent walking is expected around 12 months."},
{topic:"Pediatrics", q:"A nurse is assessing a 12-month-old. Which milestones are expected? Select all that apply.",
opts:["Walks independently or with one hand held","Says 1–2 words with meaning","Uses a pincer grasp","Stacks 6 blocks","Pulls to a standing position"],correct:[0,1,2,4],
r:"By 12 months, infants walk with assistance or independently, say a few words, use a pincer grasp, and pull to stand. Stacking 6 blocks is expected around 18–24 months."},
{topic:"Pediatrics", q:"At what age does a toddler typically begin to run and climb stairs with both feet on each step?",
opts:["12 months","18 months","24 months","36 months"],correct:2,
r:"By 24 months, toddlers can run and climb stairs placing both feet on each step. By 36 months, they alternate feet when climbing stairs."},
{topic:"Pediatrics", q:"A nurse is assessing a 3-year-old. Which developmental milestones are expected? Select all that apply.",
opts:["Rides a tricycle","Speaks in 3-word sentences","Knows own name, age, and sex","Copies a circle","Ties shoelaces independently"],correct:[0,1,2,3],
r:"By 3 years, children ride a tricycle, speak in short sentences, know basic personal information, and copy a circle. Tying shoelaces is expected around 5–6 years."},
{topic:"Pediatrics", q:"Which fine motor milestone is expected by 4 years? Select all that apply.",
opts:["Draws a person with at least 3 body parts","Uses scissors to cut a straight line","Buttons some buttons","Copies a square","Ties shoelaces independently"],correct:[0,1,2,3],
r:"By 4 years, many children can draw a person with several body parts, use scissors, button some buttons, and copy simple shapes such as a square. Independent shoelace tying is generally a later skill."},
{topic:"Pediatrics", q:"A nurse is teaching a parent about toilet training. Which readiness signs should the nurse include? Select all that apply.",
opts:["Staying dry for at least 2 hours","Showing interest in the toilet","Being able to pull pants up and down","Verbalizing the need to go","Being 12 months old"],correct:[0,1,2,3],
r:"Toilet training readiness includes bladder control (dry for 2+ hours), interest in the toilet, dressing skills, and communication. Most children are not ready until 18–24 months."},
{topic:"Pediatrics", q:"Which approach best supports a hospitalized toddler's developmental needs?",
opts:["Explain procedures in detailed medical terms","Allow the toddler to keep a favorite blanket or toy","Restrict parental presence to visiting hours","Discourage play to promote rest"],correct:1,
r:"Toddlers need familiar objects (transitional items) for security and parental presence to reduce separation anxiety. Explanations should be simple, and play should be encouraged."},
{topic:"Pediatrics", q:"A nurse is preparing a 4-year-old for a procedure. Which technique is most appropriate?",
opts:["Explain using simple words and allow the child to handle safe equipment","Give a detailed explanation of the procedure 1 day in advance","Tell the child it won't hurt at all","Perform the procedure without explanation to reduce anxiety"],correct:0,
r:"Preschoolers benefit from simple explanations, play therapy, and handling safe equipment. Detailed explanations should be given shortly before the procedure, and false reassurance should be avoided."},
{topic:"Pediatrics", q:"Which statement by a parent indicates correct understanding of car seat safety for a 3-year-old?",
opts:["'He should remain rear-facing until he reaches the car seat's rear-facing height or weight limit.'","'He should use a booster seat now.'","'He can sit in the front seat if the airbag is off.'","'He only needs a seatbelt now.'"],correct:0,
r:"Current AAP guidance recommends keeping children rear-facing for as long as possible, until they reach the highest height or weight allowed by the car seat manufacturer. They can then transition to a forward-facing seat with a harness."},
{topic:"Pediatrics", q:"A nurse is assessing a 5-year-old. Which developmental milestones are expected? Select all that apply.",
opts:["Ties shoelaces","Names 4 colors","Counts 10 or more objects","Reads simple sentences","Draws a person with 6 body parts"],correct:[0,1,2,4],
r:"By 5 years, children tie shoelaces, name colors, count 10+ objects, and draw a person with 6 body parts. Reading simple sentences is expected around 6–7 years."},
{topic:"Pediatrics", q:"A nurse is assessing a 6-year-old's cognitive development according to Piaget. Which behavior indicates the concrete operational stage?",
opts:["Egocentric thinking","Conservation of mass and volume","Abstract reasoning","Magical thinking"],correct:1,
r:"Concrete operational thought (7–11 years) includes conservation, reversibility, and logical thinking about concrete objects. Egocentric and magical thinking are preoperational (2–7 years); abstract reasoning is formal operational (11+ years)."},
{topic:"Pediatrics", q:"A 7-year-old is hospitalized. Which nursing intervention best supports Erikson's stage of industry vs. inferiority?",
opts:["Allow the child to complete schoolwork and praise accomplishments","Provide only passive activities like watching TV","Discourage interaction with other children","Focus on rest and limit all activity"],correct:0,
r:"School-age children need to feel competent and productive. Continuing schoolwork, praising achievements, and encouraging peer interaction support industry; restriction and lack of accomplishment foster inferiority."},
{topic:"Pediatrics", q:"A nurse is assessing a 10-year-old. Which developmental milestones are expected? Select all that apply.",
opts:["Understands concepts of right and wrong","Develops a sense of humor","Participates in team sports","Has a strong sense of identity","Begins to develop secondary sex characteristics"],correct:[0,1,2],
r:"School-age children develop moral reasoning, humor, and enjoy team activities. Identity formation and secondary sex characteristics emerge in adolescence (11+ years)."},
{topic:"Pediatrics", q:"Which vaccines are routinely given at 6 weeks according to the Philippine immunization schedule? Select all that apply.",
opts:["Pentavalent vaccine (DPT-HepB-Hib)","Oral polio vaccine (OPV)","BCG","Hepatitis B birth dose","Measles-containing vaccine"],correct:[0,1],
r:"At 6 weeks, the Philippine schedule includes the first pentavalent and oral polio vaccine doses. Hepatitis B birth dose and BCG are given at birth, while measles-containing vaccine is given later."},
{topic:"Pediatrics", q:"At what age is the first dose of the measles-containing vaccine (MMR/AMV) given in the Philippine EPI?",
opts:["6 weeks","9 months","12 months","15 months"],correct:1,
r:"The first measles-containing vaccine dose is given at 9 months under the Philippine EPI, with a second dose at 12 months."},
{topic:"Pediatrics", q:"Which vaccines are given at 12–15 months in the Philippine EPI? Select all that apply.",
opts:["Measles-containing vaccine (2nd dose)","MMR","Varicella","Hepatitis A","Pentavalent vaccine (booster)"],correct:[0,1],
r:"At 12–15 months, the Philippine EPI gives the 2nd measles-containing vaccine dose and MMR. Varicella and Hepatitis A may be given in the private sector but are not part of the routine EPI schedule."},
{topic:"Pediatrics", q:"A parent asks about the Pentavalent vaccine. Which diseases does it protect against? Select all that apply.",
opts:["Diphtheria","Pertussis","Tetanus","Hepatitis B","Haemophilus influenzae type b"],correct:[0,1,2,3,4],
r:"The Pentavalent vaccine protects against Diphtheria, Pertussis, Tetanus, Hepatitis B, and Haemophilus influenzae type b (Hib)."},
{topic:"Pediatrics", q:"A nurse is teaching a parent about vaccine side effects. Which are expected after DPT vaccination? Select all that apply.",
opts:["Low-grade fever","Mild fussiness","Redness and swelling at the injection site","High fever with seizures","Anaphylaxis"],correct:[0,1,2],
r:"Expected DPT side effects include low-grade fever, fussiness, and local reactions. High fever with seizures and anaphylaxis are rare and require immediate medical attention."},
{topic:"Pediatrics", q:"Which vaccine is contraindicated in a child with severe immunodeficiency?",
opts:["Inactivated polio vaccine (IPV)","Oral polio vaccine (OPV)","Hepatitis B vaccine","DPT vaccine"],correct:1,
r:"OPV is a live attenuated vaccine and is contraindicated in immunocompromised children due to the risk of vaccine-associated paralytic polio. IPV is the safer alternative."},
{topic:"Pediatrics", q:"A nurse is assessing a newborn's reflexes. Which reflexes are expected in a healthy newborn? Select all that apply.",
opts:["Moro reflex","Rooting reflex","Palmar grasp","Babinski reflex","Knee-jerk reflex absent"],correct:[0,1,2,3],
r:"Newborns should have Moro, rooting, palmar grasp, and Babinski reflexes. Absence of these or persistence beyond expected age may indicate neurologic problems."},
{topic:"Pediatrics", q:"At what age does the Moro reflex typically disappear?",
opts:["1–2 months","3–4 months","6 months","9 months"],correct:1,
r:"The Moro reflex typically disappears by 3–4 months. Persistence beyond this age may indicate neurologic immaturity or damage."},
{topic:"Pediatrics", q:"A nurse is assessing a newborn. Which findings are normal? Select all that apply.",
opts:["Respiratory rate of 40–60 breaths/min","Heart rate of 120–160 bpm","Temperature of 36.5–37.5°C (axillary)","Blood pressure of 120/80 mmHg","Weight loss up to 10% of birth weight in the first week"],correct:[0,1,2,4],
r:"Newborn norms include RR 40–60, HR 120–160, axillary temp 36.5–37.5°C, and up to 10% weight loss in the first week. Newborn BP is much lower (around 60–80/40–50 mmHg)."},
{topic:"Pediatrics", q:"A newborn is jaundiced within the first 24 hours of life. What is the priority nursing action?",
opts:["Reassure the parents that this is normal","Notify the physician immediately; this may indicate pathologic jaundice","Increase oral feedings only","Place the newborn in a dark room"],correct:1,
r:"Jaundice within the first 24 hours is always pathologic and may indicate hemolytic disease, sepsis, or other serious conditions. It requires immediate medical evaluation and possible phototherapy."},
{topic:"Pediatrics", q:"A nurse is teaching a parent about physiologic jaundice. Which statements are correct? Select all that apply.",
opts:["It typically appears after 24 hours of life","It peaks at 3–5 days in term infants","It is caused by immature liver function","It requires immediate exchange transfusion","It may be treated with phototherapy if levels are high"],correct:[0,1,2,4],
r:"Physiologic jaundice appears after 24 hours, peaks at 3–5 days, and is due to immature glucuronyl transferase activity. Treatment includes phototherapy if levels are high; exchange transfusion is reserved for severe cases."},
{topic:"Pediatrics", q:"A newborn is receiving phototherapy. Which nursing interventions are appropriate? Select all that apply.",
opts:["Cover the eyes with protective shields","Monitor temperature every 2–4 hours","Ensure adequate hydration and feeding","Remove the newborn from phototherapy for all feedings","Apply lotion to the skin to prevent dryness"],correct:[0,1,2],
r:"During phototherapy, cover the eyes, monitor temperature, and ensure hydration. Feedings can continue under phototherapy (or with brief interruptions per policy). Lotions and oils should be avoided as they can cause burns."},
{topic:"Pediatrics", q:"A nurse is assessing a child with suspected meningitis. Which findings are expected? Select all that apply.",
opts:["Nuchal rigidity","Positive Kernig's sign","Positive Brudzinski's sign","Bulging fontanel in infants","Hyperactive deep tendon reflexes"],correct:[0,1,2,3],
r:"Meningitis presents with nuchal rigidity, positive Kernig's and Brudzinski's signs, and a bulging fontanel in infants. Deep tendon reflexes are typically normal or decreased, not hyperactive."},
{topic:"Pediatrics", q:"A child is diagnosed with bacterial meningitis. Which isolation precautions are required?",
opts:["Standard precautions only","Droplet precautions until 24 hours after antibiotics","Airborne precautions","Contact precautions"],correct:1,
r:"Bacterial meningitis (e.g., from N. meningitidis, H. influenzae) requires droplet precautions until 24 hours after the start of effective antibiotic therapy."},
{topic:"Pediatrics", q:"Which findings in a child with Kawasaki disease require immediate intervention? Select all that apply.",
opts:["Cracked lips and strawberry tongue","Desquamation of the fingers and toes","Temperature of 39.5°C for 5 days","Chest pain or signs of cardiac involvement","Bilateral conjunctivitis"],correct:[2,3],
r:"Persistent high fever and cardiac involvement (myocarditis, coronary aneurysm) are the most concerning features requiring immediate intervention. The other findings are classic diagnostic signs but not emergencies themselves."},
{topic:"Pediatrics", q:"A child with Kawasaki disease is receiving IVIG. Which nursing interventions are appropriate? Select all that apply.",
opts:["Monitor vital signs during infusion","Assess for allergic reactions","Ensure adequate hydration","Administer live vaccines immediately after IVIG","Monitor for signs of heart failure"],correct:[0,1,2,4],
r:"During IVIG, monitor vitals, watch for reactions, maintain hydration, and monitor cardiac status. Live vaccines should be deferred for 11 months after IVIG due to reduced efficacy."},
{topic:"Pediatrics", q:"A child with Tetralogy of Fallot is having a 'tet spell.' What is the priority nursing action?",
opts:["Place the child in a supine position","Administer oxygen and place the child in a knee-chest position","Encourage vigorous activity","Withhold oxygen to prevent hyperoxia"],correct:1,
r:"During a tet spell, the knee-chest position increases systemic vascular resistance, reducing right-to-left shunting and improving pulmonary blood flow. Oxygen should be administered."},
{topic:"Pediatrics", q:"Which congenital heart defects are cyanotic? Select all that apply.",
opts:["Tetralogy of Fallot","Truncus arteriosus","Tricuspid atresia","Ventricular septal defect","Transposition of the great arteries"],correct:[0,1,2,4],
r:"Cyanotic defects include Tetralogy of Fallot, truncus arteriosus, tricuspid atresia, transposition of the great arteries, and total anomalous pulmonary venous return. VSD is an acyanotic defect."},
{topic:"Pediatrics", q:"A child with heart failure is receiving digoxin. Which findings indicate digoxin toxicity? Select all that apply.",
opts:["Bradycardia","Vomiting","Visual disturbances","Tachycardia","Poor feeding"],correct:[0,1,2,4],
r:"Digoxin toxicity in children presents with bradycardia, vomiting, visual disturbances, and poor feeding. Tachycardia is not typical; the heart rate is usually slow."},
{topic:"Pediatrics", q:"A nurse is teaching a parent about digoxin administration. Which instructions are correct? Select all that apply.",
opts:["Administer at the same time each day","Check the pulse before administration","Hold the dose if the pulse is below the ordered limit","Double the dose if a dose is missed","Do not mix with food if the child refuses"],correct:[0,1,2],
r:"Digoxin should be given at the same time daily, with pulse check before administration, and held if bradycardic. Missed doses should not be doubled; the nurse should be notified."},
{topic:"Pediatrics", q:"A child with nephrotic syndrome is receiving prednisone. Which nursing interventions are appropriate? Select all that apply.",
opts:["Monitor blood pressure and weight daily","Monitor for signs of infection","Encourage a low-sodium diet","Administer live vaccines during therapy","Monitor blood glucose"],correct:[0,1,2,4],
r:"Corticosteroid therapy requires monitoring of BP, weight, infection signs, and glucose. Live vaccines are contraindicated during immunosuppressive therapy."},
{topic:"Pediatrics", q:"A child with nephrotic syndrome has generalized edema. Which nursing interventions are appropriate? Select all that apply.",
opts:["Monitor daily weight","Measure abdominal girth","Encourage a low-sodium diet","Restrict fluids as ordered","Encourage vigorous activity"],correct:[0,1,2,3],
r:"For nephrotic syndrome with edema, monitor weight and abdominal girth, restrict sodium and fluids as ordered, and promote rest. Vigorous activity is not encouraged during acute edema."},
{topic:"Pediatrics", q:"A child with sickle cell disease is admitted in vaso-occlusive crisis. Which nursing interventions are appropriate? Select all that apply.",
opts:["Administer IV fluids","Administer analgesics as ordered","Apply warm compresses to painful areas","Encourage vigorous exercise","Monitor for signs of infection"],correct:[0,1,2,4],
r:"During vaso-occlusive crisis, hydration, analgesia, warm compresses, and infection monitoring are appropriate. Vigorous exercise can worsen sickling and should be avoided."},
{topic:"Pediatrics", q:"A child with hemophilia is admitted with joint bleeding. Which nursing interventions are appropriate? Select all that apply.",
opts:["Apply ice to the affected joint","Elevate the affected extremity","Administer factor replacement as ordered","Encourage active range of motion immediately","Monitor for signs of internal bleeding"],correct:[0,1,2,4],
r:"For joint bleeding in hemophilia, ice, elevation, factor replacement, and monitoring for bleeding are appropriate. Active range of motion should be avoided during acute bleeding."},
{topic:"Pediatrics", q:"Which findings suggest increased intracranial pressure (ICP) in an infant? Select all that apply.",
opts:["Bulging fontanel","High-pitched cry","Sunset eyes","Increased appetite","Separated cranial sutures"],correct:[0,1,2,4],
r:"Increased ICP in infants presents with a bulging fontanel, high-pitched cry, sunset eyes, and separated sutures. Appetite is typically decreased, not increased."},
{topic:"Pediatrics", q:"A child with increased ICP is admitted. Which nursing interventions are appropriate? Select all that apply.",
opts:["Elevate the head of the bed 15–30 degrees","Maintain a quiet, dimly lit environment","Cluster nursing care to minimize stimulation","Perform vigorous suctioning every hour","Monitor neurologic status frequently"],correct:[0,1,2,4],
r:"For increased ICP, elevate the head of the bed, minimize stimulation, cluster care, and monitor neurologic status. Vigorous suctioning can increase ICP and should be avoided or done carefully."},
{topic:"Pediatrics", q:"A nurse is assessing a child with suspected epiglottitis. Which findings are expected? Select all that apply.",
opts:["Drooling","Tripod positioning","Muffled voice","Barking cough","High fever"],correct:[0,1,2,4],
r:"Epiglottitis presents with drooling, tripod positioning, muffled voice, and high fever. A barking cough is characteristic of croup, not epiglottitis."},
{topic:"Pediatrics", q:"A child with croup is admitted. Which nursing interventions are appropriate? Select all that apply.",
opts:["Administer humidified oxygen","Keep the child calm","Administer corticosteroids as ordered","Perform throat inspection with a tongue depressor","Monitor for respiratory distress"],correct:[0,1,2,4],
r:"For croup, humidified oxygen, keeping the child calm, corticosteroids, and monitoring for distress are appropriate. Throat inspection with a tongue depressor is contraindicated in suspected epiglottitis and should be avoided."},
{topic:"Pediatrics", q:"Which findings suggest respiratory distress in a child? Select all that apply.",
opts:["Nasal flaring","Intercostal retractions","Grunting","Bradycardia","Stridor"],correct:[0,1,2,4],
r:"Respiratory distress presents with nasal flaring, retractions, grunting, stridor, and tachypnea. Bradycardia is a late sign of severe hypoxia, not an early sign of distress."},
{topic:"Pediatrics", q:"A child with asthma is prescribed a peak flow meter. Which instructions are correct? Select all that apply.",
opts:["Stand or sit upright","Take a deep breath and blow out as hard and fast as possible","Record the best of three attempts","Use the meter only during exacerbations","Use the meter at the same time each day"],correct:[0,1,2,4],
r:"Peak flow meters should be used upright, with a deep breath and forceful exhalation, recording the best of three attempts, and used consistently (daily). They are not used only during exacerbations."},
{topic:"Pediatrics", q:"A child is prescribed an albuterol inhaler with a spacer. Which instructions are correct? Select all that apply.",
opts:["Shake the inhaler before use","Use the spacer to improve delivery","Wait 30–60 seconds between puffs","Rinse the mouth after use","Administer the bronchodilator after the corticosteroid"],correct:[0,1,2,3],
r:"Albuterol should be shaken, used with a spacer, with 30–60 seconds between puffs, and the mouth rinsed after use. Bronchodilators are administered BEFORE corticosteroids, not after."},
{topic:"Pediatrics", q:"Which are signs of dehydration in an infant? Select all that apply.",
opts:["Sunken fontanel","Decreased urine output","Dry mucous membranes","Weight gain","Poor skin turgor"],correct:[0,1,2,4],
r:"Dehydration in infants presents with a sunken fontanel, decreased urine output, dry mucous membranes, and poor skin turgor. Weight loss, not gain, occurs with dehydration."},
{topic:"Pediatrics", q:"A child with severe dehydration is receiving IV fluids. Which nursing interventions are appropriate? Select all that apply.",
opts:["Monitor intake and output","Assess vital signs frequently","Monitor for signs of fluid overload","Weigh the child daily","Restrict all oral fluids"],correct:[0,1,2,3],
r:"During IV rehydration, monitor I&O, vitals, signs of overload, and daily weight. Oral fluids may be allowed as tolerated depending on the child's condition; complete restriction is not routine."},
{topic:"Pediatrics", q:"A child with diarrhea is being cared for at home. Which instructions should the nurse include? Select all that apply.",
opts:["Give oral rehydration solution (ORS) frequently in small amounts","Continue breastfeeding","Avoid sugary drinks and juices","Withhold all food for 24 hours","Monitor for signs of dehydration"],correct:[0,1,2,4],
r:"Home management of diarrhea includes ORS, continued breastfeeding, avoiding sugary drinks, and monitoring for dehydration. Food should not be withheld for 24 hours; continue age-appropriate feeds."},

// ---------- Fundamentals of Nursing 2 ----------
{topic:"Fundamentals", q:"When performing hand hygiene with alcohol-based sanitizer, how long should the friction/rubbing process last?",
opts:["5 seconds","10 seconds","20–30 seconds","60 seconds"],correct:2,
r:"WHO and CDC guidelines recommend rubbing hands with alcohol-based sanitizer for 20–30 seconds, covering all surfaces, until hands are dry."},
{topic:"Fundamentals", q:"A nurse is inserting an indwelling urinary catheter using sterile technique. Which action breaks sterility?",
opts:["Holding the catheter 2 inches from the tip","Cleaning the meatus from front to back before insertion","Setting the sterile tray below waist level","Using sterile gloves to open the sterile package"],correct:2,
r:"Sterile fields and objects must be kept at or above waist level; anything below waist level is considered contaminated because it's out of the nurse's direct line of sight."},
{topic:"Fundamentals", q:"Which vital sign finding best indicates the client is experiencing orthostatic hypotension?",
opts:["BP drop of 5 mmHg systolic when standing","BP drop of ≥20 mmHg systolic or ≥10 mmHg diastolic within 3 minutes of standing","Heart rate decrease of 10 bpm when standing","Temperature increase of 0.5°C after standing"],correct:1,
r:"Orthostatic hypotension is defined as a drop of ≥20 mmHg systolic or ≥10 mmHg diastolic BP within 3 minutes of moving from lying/sitting to standing, often with dizziness."},
{topic:"Fundamentals", q:"A client has an order for a Z-track IM injection. What is the primary purpose of this technique?",
opts:["To reduce pain at the injection site","To prevent leakage of irritating medication into subcutaneous tissue","To speed up drug absorption","To allow use of a shorter needle"],correct:1,
r:"The Z-track method displaces skin/tissue laterally before injection and releases it after withdrawal, sealing the medication in the muscle and preventing tracking/leakage into the subQ layer."},
{topic:"Fundamentals", q:"Which of the following best reflects the principle of beneficence in nursing ethics?",
opts:["Respecting a client's right to refuse treatment","Acting in ways that promote the client's well-being","Distributing care resources fairly among clients","Telling the client the truth about their diagnosis"],correct:1,
r:"Beneficence means actively acting for the benefit/good of the client. Respecting refusal relates to autonomy, fair distribution relates to justice, and truth-telling relates to veracity."},
{topic:"Fundamentals", q:"A client on bed rest is at risk for pressure injury. Which is the most effective preventive nursing action?",
opts:["Massaging reddened bony prominences vigorously","Repositioning the client at least every 2 hours","Keeping the head of bed elevated at 90 degrees continuously","Applying powder to keep skin dry"],correct:1,
r:"Regular repositioning (at least every 2 hours) relieves sustained pressure over bony prominences, which is the primary cause of pressure injury. Vigorous massage of reddened areas can worsen tissue damage."},

{topic:"Fundamentals", q:"A client has active pulmonary tuberculosis. Which type of isolation precaution is required?",
opts:["Contact precautions","Droplet precautions","Airborne precautions with a negative-pressure room","Standard precautions only"],correct:2,
r:"TB is spread via small airborne droplet nuclei that remain suspended in air; airborne precautions require an N95 respirator and a negative-pressure isolation room to prevent transmission."},
{topic:"Fundamentals", q:"When assisting a client to transfer from bed to chair, which body mechanics principle should the nurse apply?",
opts:["Keep feet close together for a narrow base","Bend at the waist to lift the client","Maintain a wide base of support and bend at the knees","Twist the trunk while lifting to save time"],correct:2,
r:"A wide base of support and bending at the knees (not the waist) lowers the center of gravity and uses leg muscles rather than the back, reducing injury risk to the nurse."},
{topic:"Fundamentals", q:"Which is the first step of the nursing process?",
opts:["Planning","Diagnosis","Assessment","Implementation"],correct:2,
r:"The nursing process begins with assessment — systematic collection of subjective and objective client data — which forms the basis for identifying nursing diagnoses and planning care."},
{topic:"Fundamentals", q:"According to Maslow's hierarchy of needs, which client need should the nurse address first?",
opts:["A client's request for spiritual counseling","A client reporting difficulty breathing","A client's concern about body image","A client wanting more visitors"],correct:1,
r:"Maslow's hierarchy prioritizes physiologic needs (like oxygenation) above safety, love/belonging, esteem, and self-actualization needs; difficulty breathing must be addressed first."},
{topic:"Fundamentals", q:"A client states, 'I feel nauseated and dizzy.' In documentation, this is classified as:",
opts:["Objective data","Subjective data","A nursing diagnosis","A validated finding"],correct:1,
r:"Subjective data is information reported by the client based on their own perception (symptoms, feelings), as opposed to objective data, which the nurse directly observes or measures (signs)."},
{topic:"Fundamentals", q:"A physician orders wrist restraints for a confused, combative client. Which nursing action is correct?",
opts:["Apply restraints indefinitely until the physician cancels the order","Use the least restrictive method necessary and reassess/document per policy","Tie restraints directly to the bed's side rails","Apply restraints without a physician's order if the nurse feels it's needed"],correct:1,
r:"Restraints should be the least restrictive intervention necessary, require a time-limited order, and demand frequent reassessment/documentation of circulation, skin integrity, and continued need."},
{topic:"Fundamentals", q:"Which of the following represents the '6 rights' of medication administration?",
opts:["Right drug, dose, route, time, patient, documentation","Right drug, cost, brand, supplier, time, patient","Right diagnosis, drug, dose, allergy, time, room","Right patient, drug, insurance, time, dose, physician"],correct:0,
r:"The 6 rights are: right patient, right drug, right dose, right route, right time, and right documentation — core safety checks before administering any medication."},
{topic:"Fundamentals", q:"A surgical wound is healing normally. Which phase of wound healing is characterized by collagen deposition and new tissue (granulation) formation?",
opts:["Hemostasis phase","Inflammatory phase","Proliferative phase","Maturation phase"],correct:2,
r:"The proliferative phase (roughly days 3–21) involves fibroblast activity, collagen synthesis, and granulation tissue formation to rebuild the wound bed, following the initial hemostasis and inflammatory phases."},
{topic:"Fundamentals", q:"When administering oxygen via nasal cannula, the flow rate should generally not exceed:",
opts:["2 L/min","6 L/min","10 L/min","15 L/min"],correct:1,
r:"Nasal cannula flow rates above 6 L/min do not significantly increase delivered FiO2 further and can cause nasal mucosa drying/irritation; higher oxygen needs require a different delivery device."},
{topic:"Fundamentals", q:"What is the primary purpose of performing passive range-of-motion (ROM) exercises for an immobile client?",
opts:["To build muscle strength","To prevent joint contractures and maintain joint mobility","To increase the client's heart rate for cardiovascular fitness","To reduce the need for pain medication"],correct:1,
r:"Passive ROM exercises move joints through their range without client effort, helping prevent contractures, maintain flexibility, and reduce complications of immobility, though they do not build muscle strength."},
{topic:"Fundamentals", q:"A nurse is performing a comprehensive health assessment. Which components are included in the general survey? Select all that apply.",
opts:["Level of consciousness","Apparent state of health","Speech and hearing","Vital signs","Body build and posture"],correct:[0,1,2,4],
r:"The general survey includes observation of LOC, apparent health, speech/hearing, body build, posture, grooming, and behavior. Vital signs are a separate, distinct assessment component."},
{topic:"Fundamentals", q:"Which sequence correctly reflects the order of a standard abdominal assessment?",
opts:["Inspection, palpation, percussion, auscultation","Inspection, auscultation, percussion, palpation","Auscultation, inspection, palpation, percussion","Percussion, inspection, auscultation, palpation"],correct:1,
r:"For the abdomen, auscultation is performed BEFORE percussion and palpation because these maneuvers can alter bowel sounds. The correct sequence is inspection, auscultation, percussion, palpation."},
{topic:"Fundamentals", q:"A nurse is assessing a client's lung sounds. Which findings are considered normal? Select all that apply.",
opts:["Vesicular breath sounds over peripheral lung fields","Bronchial breath sounds over the trachea","Crackles in the lower lung bases","Bronchovesicular sounds over the mainstem bronchi","Wheezing on expiration"],correct:[0,1,3],
r:"Normal lung sounds include vesicular over the periphery, bronchial over the trachea, and bronchovesicular over the mainstem bronchi. Crackles and wheezing are adventitious sounds indicating pathology."},
{topic:"Fundamentals", q:"A nurse is documenting a client's bowel sounds. Which description is correct for normal bowel sounds?",
opts:["High-pitched, gurgling sounds occurring every 5–15 seconds","Absent sounds for 5 minutes","Loud, high-pitched rushing sounds","Tinkling sounds with a metallic quality"],correct:0,
r:"Normal bowel sounds are high-pitched, gurgling, and occur every 5–15 seconds. Absent sounds, borborygmi (loud rushing), and tinkling/metallic sounds are abnormal findings."},
{topic:"Fundamentals", q:"A nurse is assessing a client's peripheral pulses. Which scale correctly describes a normal pulse?",
opts:["0 = absent, 1+ = weak, 2+ = normal, 3+ = increased, 4+ = bounding","0 = normal, 1+ = bounding, 2+ = weak, 3+ = absent, 4+ = increased","1+ = normal, 2+ = weak, 3+ = bounding","0 = bounding, 1+ = normal, 2+ = weak, 3+ = absent"],correct:0,
r:"The standard pulse scale is 0 (absent), 1+ (weak/thready), 2+ (normal), 3+ (increased), and 4+ (bounding/full)."},
{topic:"Fundamentals", q:"Which temperature routes are commonly used to obtain measurements that closely estimate core temperature? Select all that apply.",
opts:["Rectal","Tympanic","Oral","Axillary","Temporal artery"],correct:[0,1,4],
r:"Rectal, tympanic, and temporal artery measurements can provide useful estimates of core temperature. Oral and axillary measurements are more affected by local conditions and should not be described as direct core-temperature measurements."},
{topic:"Fundamentals", q:"Which needle angles may be appropriate for a subcutaneous injection, depending on needle length and the client's subcutaneous tissue?",
opts:["15 degrees only","45 degrees or 90 degrees","25 degrees only","90 degrees only"],correct:1,
r:"Subcutaneous injections may be administered at 45 or 90 degrees depending on the needle length, tissue depth, and technique. The goal is to deposit the medication into subcutaneous tissue rather than muscle."},
{topic:"Fundamentals", q:"Which are preferred sites for intramuscular injections? Select all that apply.",
opts:["Ventrogluteal","Vastus lateralis","Deltoid","Dorsogluteal","Dorsal forearm"],correct:[0,1,2],
r:"Common preferred IM sites include the ventrogluteal, vastus lateralis, and deltoid muscles. The dorsogluteal site is generally avoided because of the risk of sciatic nerve and vascular injury. The dorsal forearm is used for intradermal injections."},
{topic:"Fundamentals", q:"A nurse is performing an intradermal injection for tuberculosis skin testing. Which site is correct?",
opts:["Deltoid muscle","Inner forearm","Vastus lateralis","Ventrogluteal"],correct:1,
r:"Intradermal injections (Mantoux test, allergy testing) are given on the inner forearm using a 5–15 degree angle and a small-gauge needle."},
{topic:"Fundamentals", q:"A nurse is preparing to administer a medication via a nasogastric tube. Which actions are appropriate? Select all that apply.",
opts:["Verify tube placement before administration","Flush the tube with water before and after each medication","Crush enteric-coated tablets for easier administration","Administer medications one at a time","Position the client upright during administration"],correct:[0,1,3,4],
r:"Before NG medication administration: verify placement, flush before/after, give meds one at a time, and position upright. Enteric-coated and sustained-release tablets should NOT be crushed."},
{topic:"Fundamentals", q:"Which findings indicate a client may be experiencing an allergic reaction to a medication? Select all that apply.",
opts:["Urticaria","Wheezing","Hypotension","Bradycardia","Angioedema"],correct:[0,1,2,4],
r:"Allergic reactions present with urticaria, wheezing, hypotension, and angioedema. Tachycardia, not bradycardia, is typical in anaphylaxis due to compensatory mechanisms."},
{topic:"Fundamentals", q:"A nurse is preparing to administer a blood transfusion. Which actions are appropriate? Select all that apply.",
opts:["Verify the blood product with another nurse","Use a 0.9% NaCl solution to prime the tubing","Administer the transfusion within 30 minutes of receiving the unit","Monitor vital signs before, during, and after transfusion","Infuse the unit over 4 hours maximum"],correct:[0,1,3,4],
r:"Blood transfusion requires two-nurse verification, priming with 0.9% NaCl (never lactated Ringer's), transfusion within 30 minutes of receipt, vital sign monitoring, and completion within 4 hours."},
{topic:"Fundamentals", q:"A client receiving a blood transfusion develops fever, chills, and flank pain. What is the priority nursing action?",
opts:["Slow the transfusion and continue monitoring","Stop the transfusion immediately and maintain IV access with new tubing","Administer the remaining blood faster","Document the finding and continue the transfusion"],correct:1,
r:"These findings suggest a hemolytic transfusion reaction. The transfusion must be stopped immediately, IV access maintained with new tubing and 0.9% NaCl, and the physician notified."},
{topic:"Fundamentals", q:"Which actions reflect proper sterile technique when setting up a sterile field? Select all that apply.",
opts:["Open the sterile package away from the body","Keep the sterile field above waist level","Reach across the sterile field to place items","Consider any item below waist level contaminated","Avoid touching the inside of the sterile package"],correct:[0,1,3,4],
r:"Sterile technique: open packages away from the body, keep the field above waist level, consider items below waist contaminated, and never touch the inside of the package. Reaching across the field contaminates it."},
{topic:"Fundamentals", q:"A nurse is performing a wound dressing change. Which actions require sterile technique? Select all that apply.",
opts:["Changing a surgical incision dressing","Inserting a urinary catheter","Changing a chronic pressure ulcer dressing","Performing a venipuncture","Changing a dressing on a draining wound"],correct:[0,1,3,4],
r:"Sterile technique is required for surgical incisions, catheter insertion, venipuncture, and draining wounds. Chronic pressure ulcer dressings may use clean technique depending on facility policy and wound status."},
{topic:"Fundamentals", q:"Which findings indicate a wound infection? Select all that apply.",
opts:["Purulent drainage","Increased redness and warmth","Fever","Decreased pain","Wound dehiscence"],correct:[0,1,2,4],
r:"Wound infection presents with purulent drainage, redness/warmth, fever, and possible dehiscence. Pain typically INCREASES with infection, not decreases."},
{topic:"Fundamentals", q:"A nurse is teaching a client about a low-sodium diet. Which foods should the client avoid? Select all that apply.",
opts:["Canned soups","Processed meats","Fresh fruits","Pickled foods","Frozen dinners"],correct:[0,1,3,4],
r:"High-sodium foods include canned soups, processed meats, pickled foods, and frozen dinners. Fresh fruits are naturally low in sodium and encouraged."},
{topic:"Fundamentals", q:"A client is prescribed a clear liquid diet. Which items are appropriate? Select all that apply.",
opts:["Clear broth","Gelatin","Apple juice","Ice cream","Black coffee"],correct:[0,1,2,4],
r:"Clear liquids include broth, gelatin, clear juices, black coffee, tea, and popsicles. Ice cream is a full liquid, not clear liquid."},
{topic:"Fundamentals", q:"A nurse is teaching a client about a diabetic diet. Which instructions are correct? Select all that apply.",
opts:["Eat meals at consistent times","Choose complex carbohydrates","Limit refined sugars","Skip meals to control blood sugar","Monitor blood glucose as ordered"],correct:[0,1,2,4],
